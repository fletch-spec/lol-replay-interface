<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LoL Replay Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14171c;
    --border: #262b33;
    --text: #e6e9ef;
    --dim: #8891a0;
    --ok: #37d67a;
    --warn: #e0b23c;
    --bad: #e05c5c;
    --accent: #4d8dff;
    /* Team colours. Blue/red on this panel always mean ORDER/CHAOS — never a
       category — which is why structures moved off the accent blue below. */
    --blue: #4d8dff;
    --red: #e0576b;
    /* Event categories. */
    --kill: #e05c5c;
    --obj: #e0b23c;
    --struct: #7f8ea3;
    /* Cue points and the A/B loop (brief 005). Deliberately outside the event
       palette and outside blue/red, so a cue can never be misread as an event
       marker or a team. */
    --cue: #2fd4c6;
    --loop: #a97bff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }

  /* Roster */
  .roster {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    transition: opacity 0.15s ease;
  }
  .roster.disabled {
    opacity: 0.4;
    pointer-events: none;
  }
  .roster-block {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .roster-block-label {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--dim);
    padding-left: 2px;
  }
  .roster-list {
    display: flex;
    flex-direction: row;
    gap: 10px;
    /* Cards are width-capped, so at full panel width they'd otherwise bunch to
       the left with a gap of dead space at the end of each row. */
    justify-content: space-between;
  }
  /* Portrait beside the text, not above it. Stacked, the card was mostly empty
     space to the left and right of a 44px image. */
  .roster-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 9px;
    flex: 1 1 0;
    max-width: 240px;
    min-width: 0;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    cursor: pointer;
    text-align: left;
  }
  .roster-item:hover {
    border-color: var(--accent);
  }
  .roster-item.locked {
    border-color: var(--ok);
    background: rgba(55, 214, 122, 0.12);
  }
  .roster-portrait-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }
  .roster-key {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--dim);
    z-index: 1;
  }
  .roster-portrait {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--panel);
  }
  .roster-portrait-fallback {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--dim);
  }
  .roster-info {
    min-width: 0;
    flex: 1;
  }
  .roster-champ {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roster-name {
    font-size: 10px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roster-stats {
    font-size: 10px;
    color: var(--dim);
    font-family: "Consolas", "Cascadia Mono", monospace;
    white-space: nowrap;
  }

  .panel {
    width: 100%;
    /* Monitor 2 is a whole screen; a 720px column left most of it as dead
       space. Wider also means more pixels per minute on the scrub track, which
       is what separates markers in a kill-heavy game. */
    max-width: 1400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Every functional group gets its own inset card, so the panel reads as
     status / timeline / controls / roster rather than one long column. */
  .card {
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
  }

  .statusbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--dim);
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bad);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .dot.connected { background: var(--ok); }
  .dot.no-replay { background: var(--warn); }
  .dot.helper-down { background: var(--bad); }

  .status-text {
    font-weight: 600;
    color: var(--text);
  }

  .chips {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .chip {
    font-size: 12px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    letter-spacing: 0.04em;
    color: var(--dim);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .chip.mode { text-transform: uppercase; }
  .chip.playing {
    color: #9fe8bd;
    border-color: rgba(55, 214, 122, 0.35);
  }
  .chip.is-paused {
    color: var(--warn);
    border-color: rgba(224, 178, 60, 0.35);
  }

  /* Transport */
  .transport {
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  .transport.disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .timeline-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .scrub-area {
    position: relative;
    flex: 1;
    min-width: 0;
    /* Space above the track for the event marker gutter. Cue pins (brief 005)
       get the strip *below* the track, so the two never share a lane. */
    padding-top: 40px;
  }
  .scrub-track {
    position: relative;
    height: 42px;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  .scrub-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: var(--accent);
    opacity: 0.3;
    border-radius: 10px 0 0 10px;
    pointer-events: none;
  }

  /* Minute ticks — without these, "18:42" has nothing to be 18:42 *of*. */
  .scrub-ticks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 10px;
  }
  .tick {
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 7px;
    background: rgba(230, 233, 239, 0.13);
  }
  .tick.major {
    height: 13px;
    background: rgba(230, 233, 239, 0.28);
  }
  .tick-label {
    position: absolute;
    bottom: 14px;
    transform: translateX(-50%);
    font-size: 9px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    color: rgba(230, 233, 239, 0.38);
    white-space: nowrap;
  }

  /* Event markers (brief 004) — three lanes so events that collide in time
     stop colliding in pixels. Clustering runs per lane. */
  .scrub-markers {
    position: absolute;
    left: 0;
    right: 0;
    top: -34px;
    height: 34px;
  }
  .marker {
    position: absolute;
    width: 4px;
    height: 9px;
    border-radius: 2px;
    transform: translateX(-50%);
    cursor: pointer;
    opacity: 0.58;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  /* Invisible 16px hit target — the drawn marker stays thin. */
  .marker::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -4px;
    transform: translateX(-50%);
    width: 16px;
    height: 17px;
  }
  .marker.lane0 { top: 2px; }
  .marker.lane1 { top: 14px; }
  .marker.lane2 { top: 25px; }
  .marker.kill { background: var(--kill); }
  .marker.objective { background: var(--obj); }
  .marker.tower { background: var(--struct); }
  .marker.unknown { background: var(--dim); }
  .marker.ace {
    background: #fff;
    top: 0;
    height: 12px;
    width: 5px;
  }
  .marker.cluster { width: 8px; }
  .marker.past { opacity: 1; }
  .marker.hot,
  .marker:hover {
    opacity: 1;
    transform: translateX(-50%) scaleY(1.35);
  }
  .marker.active {
    opacity: 1;
    outline: 2px solid rgba(255, 255, 255, 0.9);
    outline-offset: 1px;
  }
  .marker .cap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 3px;
    border-radius: 2px 2px 0 0;
  }
  .marker .cap.order { background: var(--blue); }
  .marker .cap.chaos { background: var(--red); }

  /* Hover card — replaces native title tooltips. For a cluster it lists every
     event, each seeking to its own timestamp: before this, only the first
     event in a cluster was reachable at all. */
  .hover-card {
    position: absolute;
    left: 0;
    top: 2px;
    transform: translate(-50%, -100%);
    z-index: 40;
    display: none;
    min-width: 210px;
    max-width: 360px;
    max-height: 240px;
    overflow-y: auto;
    background: #12161c;
    border: 1px solid #2f3742;
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
  }
  .hover-card.visible { display: block; }
  .hc-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 7px;
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  .hc-row:hover { background: rgba(255, 255, 255, 0.06); }
  .hc-row.order { border-left-color: var(--blue); }
  .hc-row.chaos { border-left-color: var(--red); }
  .hc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .hc-dot.kill { background: var(--kill); }
  .hc-dot.objective { background: var(--obj); }
  .hc-dot.tower { background: var(--struct); }
  .hc-dot.unknown { background: var(--dim); }
  .hc-dot.ace { background: #fff; }
  .hc-portraits {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .hc-portrait {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    object-fit: cover;
    background: #0f1216;
  }
  .hc-portrait.victim {
    opacity: 0.7;
    filter: grayscale(0.6);
  }
  .hc-arrow {
    font-size: 10px;
    color: var(--dim);
  }
  .hc-label {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hc-time {
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    color: var(--dim);
    flex-shrink: 0;
  }

  /* Ghost playhead — preview of where a click would land, with magnetic snap. */
  .scrub-ghost {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1px dashed rgba(230, 233, 239, 0.5);
    pointer-events: none;
    display: none;
    z-index: 3;
  }
  .scrub-ghost.visible { display: block; }
  .scrub-ghost.snapped { border-left: 1px solid var(--accent); }
  .ghost-time {
    position: absolute;
    top: 5px;
    left: 6px;
    font-size: 11px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    color: var(--text);
    background: rgba(10, 12, 15, 0.92);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  .scrub-ghost.flip .ghost-time {
    left: auto;
    right: 6px;
  }
  .scrub-ghost.snapped .ghost-time { border-color: var(--accent); }

  /* --- Cue points + A/B loop (brief 005) --- */

  /* Cues live in the strip *below* the track; brief 004's event markers live in
     the gutter above it. Different side, different shape, different colour —
     two marker types on one bar must not be confusable. */
  .cue-pins {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: 15px;
  }
  .cue-pin {
    position: absolute;
    top: 0;
    width: 2px;
    height: 15px;
    background: var(--cue);
    transform: translateX(-50%);
    cursor: pointer;
  }
  /* Pin head, and a 16px hit target around the whole thing. */
  .cue-pin::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--cue);
  }
  .cue-pin::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -2px;
    transform: translateX(-50%);
    width: 16px;
    height: 19px;
  }
  .cue-pin.noted::after {
    border-radius: 2px;
  }
  .cue-pin:hover,
  .cue-pin.hot {
    background: #fff;
  }
  .cue-pin:hover::after,
  .cue-pin.hot::after {
    background: #fff;
  }
  .cue-pin.active::after {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
  }

  .loop-region {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(169, 123, 255, 0.16);
    border-left: 1px solid var(--loop);
    border-right: 1px solid var(--loop);
    pointer-events: none;
    display: none;
    z-index: 2;
  }
  .loop-region.visible { display: block; }
  .loop-region.armed { background: rgba(169, 123, 255, 0.3); }
  .loop-edge {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--loop);
    pointer-events: none;
    display: none;
    z-index: 2;
  }
  .loop-edge.visible { display: block; }
  .loop-edge::after {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 9px;
    font-weight: 700;
    color: var(--loop);
  }
  .loop-edge.a::after { content: 'A'; }
  .loop-edge.b::after { content: 'B'; }

  .chip.loop {
    color: #d8c2ff;
    border-color: rgba(169, 123, 255, 0.45);
    display: none;
  }
  .chip.loop.visible { display: inline; }
  .chip.loop.armed {
    background: rgba(169, 123, 255, 0.18);
  }

  .cue-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px;
    border-radius: 8px;
    font-size: 12px;
  }
  .cue-row:hover { background: rgba(255, 255, 255, 0.05); }
  .cue-row.active { background: rgba(47, 212, 198, 0.14); }
  .cue-num {
    flex-shrink: 0;
    width: 16px;
    text-align: right;
    font-size: 10px;
    color: var(--dim);
  }
  .cue-time {
    flex-shrink: 0;
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    color: var(--cue);
    cursor: pointer;
  }
  .cue-note {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 3px 5px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .cue-note:hover { border-color: var(--border); }
  .cue-note:focus {
    outline: none;
    border-color: var(--accent);
    background: #0b0d10;
  }
  .cue-del {
    flex-shrink: 0;
    padding: 0;
    width: 18px;
    height: 18px;
    font-size: 13px;
    line-height: 1;
    border-radius: 5px;
    color: var(--dim);
    background: transparent;
    border: 1px solid transparent;
  }
  .cue-del:hover {
    color: var(--bad);
    border-color: var(--border);
  }
  .cue-empty {
    padding: 8px 6px;
    font-size: 11px;
    color: var(--dim);
  }
  .cue-export {
    display: none;
    width: 100%;
    height: 90px;
    margin-top: 6px;
    resize: vertical;
    background: #0b0d10;
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 6px 8px;
    color: var(--text);
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    line-height: 1.5;
  }
  .cue-export.visible { display: block; }

  .cue-actions {
    display: flex;
    gap: 6px;
    padding: 6px 4px 2px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .cue-actions button {
    flex: 1;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 7px;
  }

  .timeline-side {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 170px;
    flex-shrink: 0;
  }

  .legend {
    display: flex;
    gap: 14px;
    margin-top: 7px;
    font-size: 10px;
    color: var(--dim);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 2px;
  }
  .legend-dot.kill { background: var(--kill); }
  .legend-dot.objective { background: var(--obj); }
  .legend-dot.tower { background: var(--struct); }
  .legend-dot.ace { background: #fff; }
  .legend-dot.cue {
    background: var(--cue);
    border-radius: 50%;
  }
  .events-panel {
    position: relative;
    width: 100%;
  }
  .events-toggle {
    font-size: 13px;
    padding: 10px 12px;
    width: 100%;
    text-align: left;
  }
  /* Cue rows carry an editable note field, so they need more room than an
     event row does. */
  #cuesList { width: max(360px, 100%); }
  .events-list {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    flex-direction: column;
    gap: 4px;
    width: max(280px, 100%);
    max-height: 320px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .events-panel.expanded .events-list {
    display: flex;
  }
  .event-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .event-row:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  .event-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .event-dot.kill { background: var(--bad); }
  .event-dot.objective { background: var(--warn); }
  .event-dot.tower { background: var(--accent); }
  .event-dot.unknown { background: var(--dim); }
  .event-dot.ace { background: #fff; }
  .event-label {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-time {
    color: var(--dim);
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    flex-shrink: 0;
  }

  .scrub-handle {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 6px;
    left: 0%;
    transform: translateX(-3px);
    background: var(--accent);
    border-radius: 3px;
    pointer-events: none;
    z-index: 4;
  }
  .handle-time {
    position: absolute;
    /* Clears the 15px cue-pin strip that sits directly under the track. */
    top: calc(100% + 18px);
    left: 50%;
    transform: translateX(-50%);
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    color: var(--text);
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 5px;
    white-space: nowrap;
  }
  /* At 0% / 100% a centred bubble hangs off the track and over the events
     column, so pin it to the handle's edge instead. */
  .handle-time.clamp-start {
    left: 0;
    transform: none;
  }
  .handle-time.clamp-end {
    left: auto;
    right: 0;
    transform: none;
  }

  .time-readout {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 14px;
    color: var(--dim);
    /* Clears the cue-pin strip and the handle's time bubble below the track. */
    margin-top: 39px;
  }
  .time-next {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .time-next.soon { color: var(--warn); }

  .transport-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    font-size: 15px;
    font-weight: 600;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #0f1216;
    color: var(--text);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .pause-btn {
    flex: 0 0 120px;
    background: var(--accent);
    color: #06121f;
  }

  /* Fixed-width rather than flex:1 — stretched across a 1340px card the speed
     buttons were ~230px each, which reads as five giant slabs. */
  .speed-presets {
    display: flex;
    gap: 8px;
  }
  .speed-btn { flex: 0 0 76px; }
  .speed-btn.primary { border-color: var(--accent); }
  .speed-btn.active {
    background: var(--accent);
    color: #06121f;
  }

  .hint {
    margin-left: auto;
    text-align: right;
    font-size: 11px;
    color: var(--dim);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="statusbar card">
      <div class="dot helper-down" id="statusDot"></div>
      <div class="status-text" id="statusText">Connecting to helper…</div>
      <div class="chips">
        <span class="chip mode" id="gameMode">—</span>
        <span class="chip" id="speedChip">1×</span>
        <span class="chip" id="paused">—</span>
        <span class="chip loop" id="loopChip"></span>
      </div>
    </div>

    <div class="transport disabled" id="transport">
      <div class="timeline-row card">
        <div class="scrub-area" id="scrubArea">
          <div class="scrub-track" id="scrubTrack">
            <div class="scrub-fill" id="scrubFill"></div>
            <div class="scrub-ticks" id="scrubTicks"></div>
            <div class="loop-region" id="loopRegion"></div>
            <div class="loop-edge a" id="loopEdgeA"></div>
            <div class="loop-edge b" id="loopEdgeB"></div>
            <div class="scrub-markers" id="scrubMarkers"></div>
            <div class="cue-pins" id="cuePins"></div>
            <div class="scrub-ghost" id="scrubGhost">
              <div class="ghost-time" id="ghostTime">0:00</div>
            </div>
            <div class="scrub-handle" id="scrubHandle">
              <div class="handle-time" id="handleTime">0:00</div>
            </div>
          </div>
          <div class="hover-card" id="hoverCard"></div>
          <div class="time-readout">
            <span id="timeCurrent">0:00</span>
            <span class="time-next" id="timeNext"></span>
            <span id="timeTotal">0:00</span>
          </div>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot kill"></span>Kill</span>
            <span class="legend-item"><span class="legend-dot objective"></span>Objective</span>
            <span class="legend-item"><span class="legend-dot tower"></span>Structure</span>
            <span class="legend-item"><span class="legend-dot ace"></span>Ace</span>
            <span class="legend-item">Top cap = team</span>
            <span class="legend-item"><span class="legend-dot cue"></span>Cue (below bar)</span>
          </div>
        </div>

        <div class="timeline-side">
          <div class="events-panel" id="eventsPanel">
            <button class="events-toggle" id="eventsToggle">Events (0)</button>
            <div class="events-list" id="eventsList"></div>
          </div>
          <div class="events-panel" id="cuesPanel">
            <button class="events-toggle" id="cuesToggle">Cues (0)</button>
            <div class="events-list" id="cuesList"></div>
          </div>
        </div>
      </div>

      <div class="transport-controls card">
        <button class="pause-btn" id="pauseBtn">Pause</button>
        <div class="speed-presets" id="speedPresets">
          <button class="speed-btn" data-speed="0.25">0.25×</button>
          <button class="speed-btn primary" data-speed="0.5">0.5×</button>
          <button class="speed-btn" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="4">4×</button>
        </div>
        <div class="hint">
          <div>Space = pause · ←/→ = ±5s · shift+←/→ = ±1s · , / . = prev/next event · alt = no snap</div>
          <div>M = place cue · N / B = next/prev cue · [ ] = loop A/B · L = loop on/off · Esc = clear loop</div>
        </div>
      </div>
    </div>

    <div class="roster disabled" id="roster">
      <div class="roster-block">
        <div class="roster-block-label">Blue</div>
        <div class="roster-list" id="blueList"></div>
      </div>
      <div class="roster-block">
        <div class="roster-block-label">Red</div>
        <div class="roster-list" id="redList"></div>
      </div>
    </div>
  </div>

<script>
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const gameModeEl = document.getElementById('gameMode');
  const pausedEl = document.getElementById('paused');

  const speedChipEl = document.getElementById('speedChip');

  const transportEl = document.getElementById('transport');
  const scrubAreaEl = document.getElementById('scrubArea');
  const scrubTrack = document.getElementById('scrubTrack');
  const scrubFill = document.getElementById('scrubFill');
  const scrubTicksEl = document.getElementById('scrubTicks');
  const scrubGhostEl = document.getElementById('scrubGhost');
  const ghostTimeEl = document.getElementById('ghostTime');
  const scrubHandle = document.getElementById('scrubHandle');
  const handleTimeEl = document.getElementById('handleTime');
  const timeCurrentEl = document.getElementById('timeCurrent');
  const timeNextEl = document.getElementById('timeNext');
  const timeTotalEl = document.getElementById('timeTotal');
  const hoverCardEl = document.getElementById('hoverCard');
  const pauseBtn = document.getElementById('pauseBtn');
  const speedPresets = document.getElementById('speedPresets');

  const rosterEl = document.getElementById('roster');
  const blueListEl = document.getElementById('blueList');
  const redListEl = document.getElementById('redList');
  const BLUE_KEYS = ['1', '2', '3', '4', '5'];
  const RED_KEYS = ['Q', 'W', 'E', 'R', 'T'];

  const scrubMarkersEl = document.getElementById('scrubMarkers');
  const eventsPanelEl = document.getElementById('eventsPanel');
  const eventsToggleEl = document.getElementById('eventsToggle');
  const eventsListEl = document.getElementById('eventsList');

  const cuePinsEl = document.getElementById('cuePins');
  const cuesPanelEl = document.getElementById('cuesPanel');
  const cuesToggleEl = document.getElementById('cuesToggle');
  const cuesListEl = document.getElementById('cuesList');
  const loopRegionEl = document.getElementById('loopRegion');
  const loopEdgeAEl = document.getElementById('loopEdgeA');
  const loopEdgeBEl = document.getElementById('loopEdgeB');
  const loopChipEl = document.getElementById('loopChip');

  let currentState = 'helper-down';
  let gameModeKnown = false;

  // Single source of truth, refreshed ~10x/sec from the helper's WebSocket push.
  let lastPolled = { time: 0, length: 0, speed: 1, paused: false, seeking: false };

  // Scrub drag state — follows the mouse locally, writes once on release.
  let isDragging = false;
  let dragPreviewTime = null;

  // Seek coalescing — rapid arrow presses / drags collapse to the latest target only.
  let seekRunning = false;
  let pendingSeekTarget = null;
  let pendingSeekHold = false;
  let currentSeekTarget = null;

  // Serializes every write to /replay/playback so pause/seek/speed never interleave.
  let mutexQueue = Promise.resolve();
  function withMutex(fn) {
    const run = mutexQueue.then(fn, fn);
    mutexQueue = run.then(() => {}, () => {});
    return run;
  }

  let optimisticSpeed = null;

  function formatTime(seconds) {
    if (typeof seconds !== 'number' || !isFinite(seconds)) return '0:00';
    const s = Math.max(0, Math.floor(seconds));
    const mm = Math.floor(s / 60);
    const ss = s % 60;
    return `${mm}:${String(ss).padStart(2, '0')}`;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function setState(state, label) {
    currentState = state;
    statusDot.className = `dot ${state}`;
    statusText.textContent = label;
    transportEl.classList.toggle('disabled', state !== 'connected');
    rosterEl.classList.toggle('disabled', state !== 'connected');
  }

  function getDisplayTime() {
    if (isDragging) return dragPreviewTime;
    if (seekRunning && currentSeekTarget !== null) return currentSeekTarget;
    return lastPolled.time;
  }

  function getDisplaySpeed() {
    return optimisticSpeed !== null ? optimisticSpeed : lastPolled.speed;
  }

  // Everything below runs ~10x/sec off the WS push, so each branch guards
  // against redundant DOM writes rather than re-rendering unconditionally.
  let lastRenderedLength = -1;
  let lastHandleLabel = '';
  let lastHandleClamp = '';
  let lastPausedLabel = '';
  let lastSpeedLabel = '';

  function renderTransport() {
    const length = lastPolled.length || 0;
    const time = getDisplayTime();
    const pct = length > 0 ? clamp((time / length) * 100, 0, 100) : 0;

    if (length !== lastRenderedLength) {
      lastRenderedLength = length;
      renderTicks();
      renderMarkers();
      renderCuePins();
      renderLoop();
    }

    scrubFill.style.width = `${pct}%`;
    scrubHandle.style.left = `${pct}%`;

    const timeLabel = formatTime(time);
    timeCurrentEl.textContent = timeLabel;
    if (timeLabel !== lastHandleLabel) {
      lastHandleLabel = timeLabel;
      handleTimeEl.textContent = timeLabel;
    }
    const handleClamp = pct < 5 ? 'start' : pct > 95 ? 'end' : '';
    if (handleClamp !== lastHandleClamp) {
      lastHandleClamp = handleClamp;
      handleTimeEl.classList.toggle('clamp-start', handleClamp === 'start');
      handleTimeEl.classList.toggle('clamp-end', handleClamp === 'end');
    }
    timeTotalEl.textContent = formatTime(length);

    updateEventProgress(time);

    pauseBtn.textContent = lastPolled.paused ? 'Play' : 'Pause';
    const pausedLabel = lastPolled.paused ? '❚❚ Paused' : '▶ Playing';
    if (pausedLabel !== lastPausedLabel) {
      lastPausedLabel = pausedLabel;
      pausedEl.textContent = pausedLabel;
      pausedEl.classList.toggle('is-paused', lastPolled.paused);
      pausedEl.classList.toggle('playing', !lastPolled.paused);
    }

    const speed = getDisplaySpeed();
    const speedLabel = `${speed}×`;
    if (speedLabel !== lastSpeedLabel) {
      lastSpeedLabel = speedLabel;
      speedChipEl.textContent = speedLabel;
      for (const btn of speedPresets.querySelectorAll('.speed-btn')) {
        btn.classList.toggle('active', Number(btn.dataset.speed) === Number(speed));
      }
    }
  }

  // --- Minute ticks ---

  function renderTicks() {
    const length = lastPolled.length || 0;
    scrubTicksEl.replaceChildren();
    if (length <= 0) return;

    const MINOR = 60;
    const MAJOR = 300;
    for (let t = MINOR; t < length; t += MINOR) {
      const pct = (t / length) * 100;
      const isMajor = t % MAJOR === 0;
      const tick = document.createElement('div');
      tick.className = isMajor ? 'tick major' : 'tick';
      tick.style.left = `${pct}%`;
      scrubTicksEl.appendChild(tick);
      if (isMajor) {
        const label = document.createElement('div');
        label.className = 'tick-label';
        label.style.left = `${pct}%`;
        label.textContent = formatTime(t);
        scrubTicksEl.appendChild(label);
      }
    }
  }

  function clearTransportDisplay() {
    lastPolled = { time: 0, length: 0, speed: 1, paused: false, seeking: false };
    renderTransport();
  }

  // --- Roster / camera lock ---

  let cameraState = { attached: false, selectionName: null };
  let lockInFlight = false;

  async function lockCamera(riotIdGameName) {
    if (lockInFlight) return;
    lockInFlight = true;
    try {
      await fetch('/api/replay/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ selectionName: riotIdGameName, cameraAttached: true }),
      });
    } catch (err) {
      // Next roster poll tick reconciles the lock indicator regardless.
    } finally {
      lockInFlight = false;
    }
  }

  function buildRosterItem(player, key) {
    const item = document.createElement('div');
    item.className = 'roster-item';

    const isLocked =
      cameraState.attached &&
      cameraState.selectionName &&
      cameraState.selectionName.toLowerCase() === player.riotIdGameName.toLowerCase();
    item.classList.toggle('locked', isLocked);

    const portraitWrap = document.createElement('div');
    portraitWrap.className = 'roster-portrait-wrap';

    const keyEl = document.createElement('div');
    keyEl.className = 'roster-key';
    keyEl.textContent = key || '';
    portraitWrap.appendChild(keyEl);

    const img = document.createElement('img');
    img.className = 'roster-portrait';
    img.src = `/portraits/${encodeURIComponent(player.championName)}.png`;
    img.addEventListener('error', () => {
      const fallback = document.createElement('div');
      fallback.className = 'roster-portrait-fallback';
      fallback.textContent = (player.championName || '?').charAt(0);
      img.replaceWith(fallback);
    });
    portraitWrap.appendChild(img);
    item.appendChild(portraitWrap);

    const info = document.createElement('div');
    info.className = 'roster-info';

    const champEl = document.createElement('div');
    champEl.className = 'roster-champ';
    champEl.textContent = player.championName;
    info.appendChild(champEl);

    const nameEl = document.createElement('div');
    nameEl.className = 'roster-name';
    nameEl.textContent = player.riotIdGameName;
    info.appendChild(nameEl);

    const statsEl = document.createElement('div');
    statsEl.className = 'roster-stats';
    const s = player.scores || {};
    statsEl.textContent = `${s.kills ?? 0}/${s.deaths ?? 0}/${s.assists ?? 0} · ${s.creepScore ?? 0} CS`;
    info.appendChild(statsEl);

    item.appendChild(info);

    item.addEventListener('click', () => lockCamera(player.riotIdGameName));
    return item;
  }

  function renderTeamBlock(container, players, keys) {
    container.replaceChildren();
    players.forEach((p, i) => container.appendChild(buildRosterItem(p, keys[i])));
  }

  // Events carry summoner names only, so the timeline leans on the roster to
  // resolve a name to a champion portrait and a team colour. Best-effort:
  // turret/minion killers simply won't resolve, and the UI degrades to text.
  let playerByName = new Map();

  function playerFor(name) {
    if (!name) return null;
    return playerByName.get(String(name).toLowerCase()) || null;
  }

  function teamFor(name) {
    const player = playerFor(name);
    return player ? player.team : null;
  }

  function renderRoster(players) {
    playerByName = new Map(
      players
        .filter((p) => p.riotIdGameName)
        .map((p) => [p.riotIdGameName.toLowerCase(), { champion: p.championName, team: p.team }])
    );
    const blue = players.filter((p) => p.team === 'ORDER');
    const red = players.filter((p) => p.team === 'CHAOS');
    renderTeamBlock(blueListEl, blue, BLUE_KEYS);
    renderTeamBlock(redListEl, red, RED_KEYS);

    // Markers can be built before the first roster arrives, in which case they
    // have no team caps yet. Redraw once the names are actually resolvable.
    if (markersRenderedWithoutTeams && playerByName.size > 0) renderMarkers();
  }

  function clearRosterDisplay() {
    playerByName = new Map();
    blueListEl.replaceChildren();
    redListEl.replaceChildren();
  }

  async function fetchGameMode() {
    try {
      const res = await fetch('/api/liveclientdata/gamestats');
      if (!res.ok) throw new Error(`status_${res.status}`);
      const data = await res.json();
      gameModeEl.textContent = data.gameMode || '—';
      gameModeKnown = true;
      syncCuesToIdentity(); // identity is only complete once gameMode lands
    } catch (err) {
      // replay may not be loaded yet — retry loop below will try again
    }
  }

  setInterval(() => {
    if (!gameModeKnown && currentState === 'connected') fetchGameMode();
  }, 3000);

  // --- Event timeline ---

  // Events accumulate here for the whole page lifetime — seeking backward must never wipe them.
  // Keyed by content fingerprint, not EventID: the replay client re-emits the same real event
  // under a brand new EventID every time playback passes over that point again, so EventID
  // alone is not a safe dedup key here despite what it looks like it should be.
  let eventsByKey = new Map();
  let eventsExpanded = false;
  let harvestToken = 0; // bumped whenever a new replay connects, invalidates any in-flight harvest
  let lastProcessId = null;

  const EVENT_CATEGORY = {
    ChampionKill: 'kill',
    Multikill: 'kill',
    FirstBlood: 'kill',
    Ace: 'ace',
    DragonKill: 'objective',
    BaronKill: 'objective',
    HeraldKill: 'objective',
    TurretKilled: 'tower',
    InhibKilled: 'tower',
    FirstBrick: 'tower',
  };
  const IGNORED_EVENT_NAMES = new Set(['GameStart', 'MinionsSpawning', 'GameEnd', 'InhibRespawned']);
  const loggedUnknownEvents = new Set();

  function categoryFor(event) {
    const cat = EVENT_CATEGORY[event.EventName];
    if (cat) return cat;
    if (!IGNORED_EVENT_NAMES.has(event.EventName) && !loggedUnknownEvents.has(event.EventName)) {
      loggedUnknownEvents.add(event.EventName);
      console.log(`[events] unrecognised EventName "${event.EventName}" — showing as unknown`, event);
    }
    return 'unknown';
  }

  function sideName(team) {
    return team === 'ORDER' ? 'blue' : 'red';
  }

  // Structure IDs look like `Turret_TChaos_L2_P3_2521511112_0`. Only the team
  // segment is safe to read — the L/P numbers have no documented lane mapping,
  // so guessing "bot outer" from them would print confident nonsense. The raw
  // ID is useless in a readout, so drop it and lead with the killer instead.
  function structureSide(structureId) {
    if (typeof structureId !== 'string') return '';
    if (structureId.includes('TOrder')) return ' (blue)';
    if (structureId.includes('TChaos')) return ' (red)';
    return '';
  }

  function describeEvent(event) {
    switch (event.EventName) {
      case 'ChampionKill':
        return `${event.KillerName} killed ${event.VictimName}`;
      case 'Multikill':
        return `${event.KillerName} multikill (${event.KillStreak}x)`;
      case 'FirstBlood':
        return `First Blood — ${event.Recipient}`;
      case 'Ace':
        return `Ace — ${event.Acer || ''}${event.AcingTeam ? ` (${sideName(event.AcingTeam)} team)` : ''}`.trim();
      case 'DragonKill':
        return `Dragon (${event.DragonType || '?'}) — ${event.KillerName}`;
      case 'BaronKill':
        return `Baron — ${event.KillerName}`;
      case 'HeraldKill':
        return `Herald — ${event.KillerName}`;
      case 'TurretKilled':
        return `Turret${structureSide(event.TurretKilled)} — ${event.KillerName || '?'}`;
      case 'InhibKilled':
        return `Inhibitor${structureSide(event.InhibKilled)} — ${event.KillerName || '?'}`;
      case 'FirstBrick':
        return `First Tower — ${event.KillerName || ''}`.trim();
      default:
        return event.EventName;
    }
  }

  // Identifies "the same real event" independent of EventID, which the client reassigns
  // every time replay playback re-passes the point it happened at. 200ms buckets absorb the
  // few-millisecond jitter observed between re-emitted copies of the same event.
  function eventFingerprint(event) {
    return [
      event.EventName,
      Math.round(event.EventTime * 5),
      event.KillerName || '',
      event.VictimName || '',
      event.Recipient || '',
      event.Acer || '',
      event.TurretKilled || '',
      event.InhibKilled || '',
    ].join('|');
  }

  function visibleEvents() {
    return [...eventsByKey.values()]
      .filter((e) => !IGNORED_EVENT_NAMES.has(e.EventName))
      .sort((a, b) => a.EventTime - b.EventTime);
  }

  // Lane 0 = fights, lane 1 = neutral objectives, lane 2 = structures. Clustering
  // runs inside a lane, so a kill and a turret at the same second no longer
  // collapse into one ambiguous marker.
  const LANE_FOR = { kill: 0, ace: 0, objective: 1, tower: 2, unknown: 2 };
  const CLUSTER_PX = 7;

  // Sorted by time. Each entry: { lane, pxX, time, events, el }. Used for hover
  // cards, snapping, and active-event tracking, so it is the one structure the
  // whole timeline reads from.
  let markerClusters = [];
  let sortedEvents = [];
  let markersRenderedWithoutTeams = false;
  let lastMarkerTrackWidth = 0;

  function renderMarkers() {
    const length = lastPolled.length || 0;
    hideHoverCard();
    scrubMarkersEl.replaceChildren();
    markerClusters = [];
    activeClusterIdx = -2;
    if (length <= 0) return;

    const trackWidth = scrubTrack.getBoundingClientRect().width || 1;
    lastMarkerTrackWidth = trackWidth;
    markersRenderedWithoutTeams = playerByName.size === 0;

    const lanes = [[], [], []];
    for (const event of sortedEvents) {
      const lane = LANE_FOR[categoryFor(event)] ?? 2;
      lanes[lane].push(event);
    }

    for (let lane = 0; lane < lanes.length; lane++) {
      let cursorPx = -Infinity;
      let current = null;
      for (const event of lanes[lane]) {
        const pxX = (event.EventTime / length) * trackWidth;
        if (current && pxX - cursorPx < CLUSTER_PX) {
          current.events.push(event);
        } else {
          current = { lane, pxX, time: event.EventTime, events: [event] };
          markerClusters.push(current);
        }
        cursorPx = pxX;
      }
    }

    markerClusters.sort((a, b) => a.time - b.time);
    for (const cluster of markerClusters) {
      cluster.el = buildMarker(cluster, length);
      scrubMarkersEl.appendChild(cluster.el);
    }

    updateEventProgress(getDisplayTime(), true);
  }

  function buildMarker(cluster, length) {
    const first = cluster.events[0];
    const isAce = cluster.events.some((e) => categoryFor(e) === 'ace');
    const cat = isAce ? 'ace' : categoryFor(first);

    const marker = document.createElement('div');
    marker.className = `marker ${cat} lane${cluster.lane}${cluster.events.length > 1 ? ' cluster' : ''}`;
    marker.style.left = `${(first.EventTime / length) * 100}%`;

    const team = teamFor(first.KillerName);
    if (team && cat !== 'ace') {
      const cap = document.createElement('div');
      cap.className = `cap ${team === 'ORDER' ? 'order' : 'chaos'}`;
      marker.appendChild(cap);
    }

    marker.addEventListener('mousedown', (e) => e.stopPropagation());
    marker.addEventListener('click', (e) => {
      e.stopPropagation();
      // Most cues land on events anyway — shift+click saves playing through to
      // the moment just to press M there.
      if (e.shiftKey) placeCue(first.EventTime);
      else requestSeek(first.EventTime);
    });
    marker.addEventListener('mouseenter', () => showHoverCard(cluster));
    marker.addEventListener('mouseleave', scheduleHideHoverCard);
    return marker;
  }

  // --- Active / next event ---

  let activeClusterIdx = -2;
  let lastNextLabel = '';
  let lastNextSoon = false;

  function updateEventProgress(time, force) {
    let idx = -1;
    for (let i = 0; i < markerClusters.length; i++) {
      if (markerClusters[i].time <= time) idx = i;
      else break;
    }
    if (idx !== activeClusterIdx || force) {
      activeClusterIdx = idx;
      for (let i = 0; i < markerClusters.length; i++) {
        const el = markerClusters[i].el;
        el.classList.toggle('past', i <= idx);
        el.classList.toggle('active', i === idx);
      }
    }

    const next = sortedEvents.find((e) => e.EventTime > time + 0.05);
    const label = next ? `▸ ${describeEvent(next)} in ${formatTime(next.EventTime - time)}` : '';
    if (label !== lastNextLabel) {
      lastNextLabel = label;
      timeNextEl.textContent = label;
    }
    const soon = !!next && next.EventTime - time <= 10;
    if (soon !== lastNextSoon) {
      lastNextSoon = soon;
      timeNextEl.classList.toggle('soon', soon);
    }
  }

  function stepEvent(direction) {
    const time = getDisplayTime();
    const target =
      direction > 0
        ? sortedEvents.find((e) => e.EventTime > time + 0.5)
        : [...sortedEvents].reverse().find((e) => e.EventTime < time - 0.5);
    if (target) requestSeek(target.EventTime);
  }

  // --- Hover card ---

  let hoverCluster = null;
  let hoverAnchorEl = null;
  let hoverHideTimer = null;

  function portraitImg(champion, extraClass) {
    const img = document.createElement('img');
    img.className = `hc-portrait${extraClass ? ` ${extraClass}` : ''}`;
    img.src = `/portraits/${encodeURIComponent(champion)}.png`;
    img.alt = champion;
    img.addEventListener('error', () => img.remove());
    return img;
  }

  function buildHoverRow(event) {
    const cat = categoryFor(event);
    const killer = playerFor(event.KillerName);
    const victim = playerFor(event.VictimName);

    const row = document.createElement('div');
    row.className = 'hc-row';
    if (killer) row.classList.add(killer.team === 'ORDER' ? 'order' : 'chaos');

    const dot = document.createElement('div');
    dot.className = `hc-dot ${cat}`;
    row.appendChild(dot);

    if (killer || victim) {
      const portraits = document.createElement('div');
      portraits.className = 'hc-portraits';
      if (killer) portraits.appendChild(portraitImg(killer.champion));
      if (killer && victim) {
        const arrow = document.createElement('span');
        arrow.className = 'hc-arrow';
        arrow.textContent = '›';
        portraits.appendChild(arrow);
      }
      if (victim) portraits.appendChild(portraitImg(victim.champion, 'victim'));
      row.appendChild(portraits);
    }

    const label = document.createElement('div');
    label.className = 'hc-label';
    label.textContent = describeEvent(event);
    row.appendChild(label);

    const time = document.createElement('div');
    time.className = 'hc-time';
    time.textContent = formatTime(event.EventTime);
    row.appendChild(time);

    row.addEventListener('click', (e) => {
      e.stopPropagation();
      hideHoverCard();
      if (e.shiftKey) placeCue(event.EventTime);
      else requestSeek(event.EventTime);
    });
    return row;
  }

  // Shared by event markers and cue pins — both anchor a card to a position on
  // the track, they just build different rows.
  function openHoverCard(pxX, rows, anchorEl) {
    clearTimeout(hoverHideTimer);
    if (hoverAnchorEl && hoverAnchorEl !== anchorEl) hoverAnchorEl.classList.remove('hot');
    hoverAnchorEl = anchorEl;
    if (anchorEl) anchorEl.classList.add('hot');

    hoverCardEl.replaceChildren(...rows);
    hoverCardEl.classList.add('visible');

    const areaWidth = scrubAreaEl.getBoundingClientRect().width;
    const cardWidth = hoverCardEl.getBoundingClientRect().width;
    const half = cardWidth / 2;
    hoverCardEl.style.left = `${clamp(pxX, half + 2, Math.max(half + 2, areaWidth - half - 2))}px`;
  }

  function showHoverCard(cluster) {
    hoverCluster = cluster;
    openHoverCard(cluster.pxX, cluster.events.map(buildHoverRow), cluster.el);
  }

  function scheduleHideHoverCard() {
    clearTimeout(hoverHideTimer);
    hoverHideTimer = setTimeout(() => hideHoverCard(), 140);
  }

  function hideHoverCard() {
    clearTimeout(hoverHideTimer);
    hoverCardEl.classList.remove('visible');
    hoverCardEl.replaceChildren();
    if (hoverAnchorEl) hoverAnchorEl.classList.remove('hot');
    hoverAnchorEl = null;
    hoverCluster = null;
  }

  hoverCardEl.addEventListener('mouseenter', () => clearTimeout(hoverHideTimer));
  hoverCardEl.addEventListener('mouseleave', scheduleHideHoverCard);

  function renderEventList() {
    const events = sortedEvents;
    eventsToggleEl.textContent = `Events (${events.length}) ${eventsExpanded ? '▾' : '▸'}`;
    eventsListEl.replaceChildren();
    for (const event of events) {
      const row = document.createElement('div');
      row.className = 'event-row';

      const dot = document.createElement('div');
      dot.className = `event-dot ${categoryFor(event)}`;
      row.appendChild(dot);

      const label = document.createElement('div');
      label.className = 'event-label';
      label.textContent = describeEvent(event);
      row.appendChild(label);

      const time = document.createElement('div');
      time.className = 'event-time';
      time.textContent = formatTime(event.EventTime);
      row.appendChild(time);

      row.addEventListener('click', () => requestSeek(event.EventTime));
      eventsListEl.appendChild(row);
    }
  }

  eventsToggleEl.addEventListener('click', () => {
    eventsExpanded = !eventsExpanded;
    eventsPanelEl.classList.toggle('expanded', eventsExpanded);
    renderEventList();
  });

  function clearEventsDisplay() {
    eventsByKey.clear();
    loggedUnknownEvents.clear();
    sortedEvents = [];
    renderMarkers();
    renderEventList();
  }

  function mergeEvents(events) {
    let changed = false;
    for (const event of events) {
      const key = eventFingerprint(event);
      if (!eventsByKey.has(key)) changed = true;
      eventsByKey.set(key, event);
    }
    if (changed) {
      sortedEvents = visibleEvents();
      renderMarkers();
      renderEventList();
    }
  }

  // The Replay API has no stable game identifier: /replay/game returns only a
  // processID (new every client launch) and no path in the whole spec carries a
  // match ID or the replay filename — checked against the swagger, not assumed.
  // So identity is the composite brief 005 names as its fallback. Imperfect, but
  // it distinguishes replays in practice, and events and cues must agree on it.
  function replayIdentity() {
    return `${gameModeEl.textContent}:${Math.round(lastPolled.length)}`;
  }

  function identityKnown() {
    return gameModeEl.textContent !== '—' && (lastPolled.length || 0) > 0;
  }

  function eventsCacheKey() {
    return `lol-events:${replayIdentity()}`;
  }

  function cuesStorageKey() {
    return `cues:${replayIdentity()}`;
  }

  // Seeks to the end so the client's cumulative event feed populates fully, then seeks back.
  // Cached by a (gameMode, length) fingerprint so reopening the same replay is instant.
  async function harvestEvents() {
    const token = ++harvestToken;
    const length = lastPolled.length;
    if (!length) return;

    const cacheKey = eventsCacheKey();
    try {
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        mergeEvents(JSON.parse(cached));
        return;
      }
    } catch (err) {
      // Corrupt cache entry — fall through to a real harvest.
    }

    const originalTime = lastPolled.time;
    await requestSeek(Math.max(0, length - 1));

    // Poll briefly for GameEnd to show up (definitive harvest-complete signal); give up after ~3s.
    for (let i = 0; i < 6; i++) {
      await new Promise((resolve) => setTimeout(resolve, 500));
      if (token !== harvestToken) return; // a different replay connected mid-harvest
      if ([...eventsByKey.values()].some((e) => e.EventName === 'GameEnd')) break;
    }

    if (token === harvestToken) {
      try {
        localStorage.setItem(cacheKey, JSON.stringify([...eventsByKey.values()]));
      } catch (err) {
        // Storage full or unavailable — harvest still worked for this session.
      }
      requestSeek(originalTime);
    }
  }

  function handleNewGame() {
    gameModeKnown = false;
    harvestToken++; // invalidate any harvest still running against the previous replay
    clearEventsDisplay();
    (async () => {
      await fetchGameMode();
      syncCuesToIdentity();
      harvestEvents();
    })();
  }

  // The WebSocket can stay "connected" while the underlying replay swaps to a different game
  // entirely (another app on this machine drives the same client) — processID is the signal
  // that catches that case, since the WS state transition alone won't.
  function checkGameChange(processID) {
    if (processID == null) return;
    if (lastProcessId === null) {
      lastProcessId = processID;
      return;
    }
    if (processID === lastProcessId) return;
    lastProcessId = processID;
    console.log('[events] replay processID changed mid-session — clearing accumulated events for the new game');
    handleNewGame();
  }

  // --- Cue points + A/B loop (brief 005) ---

  const DEFAULT_LEAD = 2;

  let cues = [];
  let activeCueIndex = null;
  let cuesExpanded = false;
  let cueIdentity = null;

  let loopA = null;
  let loopB = null;
  let loopEnabled = false;

  // Built once and re-appended on each list render, so its contents and
  // selection survive the list repainting underneath it.
  const exportAreaEl = document.createElement('textarea');
  exportAreaEl.className = 'cue-export';
  exportAreaEl.readOnly = true;
  exportAreaEl.spellcheck = false;

  // A and B are kept exactly as pressed; the usable range is derived, so setting
  // them in either order works.
  function loopRange() {
    if (loopA === null || loopB === null) return null;
    const start = Math.min(loopA, loopB);
    const end = Math.max(loopA, loopB);
    return end - start < 0.5 ? null : { start, end };
  }

  function loadCues() {
    try {
      const raw = localStorage.getItem(cuesStorageKey());
      const parsed = raw ? JSON.parse(raw) : [];
      cues = (Array.isArray(parsed) ? parsed : [])
        .filter((c) => c && typeof c.t === 'number' && isFinite(c.t))
        .map((c) => ({
          t: c.t,
          note: typeof c.note === 'string' ? c.note : '',
          lead: typeof c.lead === 'number' ? c.lead : DEFAULT_LEAD,
        }))
        .sort((a, b) => a.t - b.t);
    } catch (err) {
      cues = []; // Corrupt entry — start clean rather than blocking the panel.
    }
    activeCueIndex = null;
    renderCues();
  }

  function saveCues() {
    if (!identityKnown()) return;
    try {
      localStorage.setItem(cuesStorageKey(), JSON.stringify(cues));
    } catch (err) {
      // Storage full or unavailable — cues still work for this session.
    }
  }

  // Identity only becomes known once both gameMode and length have arrived, and
  // it changes when a different replay loads. Every path that could change it
  // ends up here.
  function syncCuesToIdentity() {
    if (!identityKnown()) return;
    const identity = replayIdentity();
    if (identity === cueIdentity) return;
    cueIdentity = identity;
    clearLoop();
    loadCues();
  }

  function clearCuesDisplay() {
    cues = [];
    activeCueIndex = null;
    cueIdentity = null;
    clearLoop();
    renderCues();
  }

  function placeCue(atTime) {
    if (!identityKnown()) return;
    const t = clamp(typeof atTime === 'number' ? atTime : getDisplayTime(), 0, lastPolled.length || 0);
    // Double-tap guard — M is meant to be hit fast and without looking.
    if (cues.some((c) => Math.abs(c.t - t) < 0.5)) return;
    cues.push({ t, note: '', lead: DEFAULT_LEAD });
    cues.sort((a, b) => a.t - b.t);
    saveCues();
    renderCues();
  }

  function deleteCue(index) {
    cues.splice(index, 1);
    if (activeCueIndex !== null && activeCueIndex >= cues.length) activeCueIndex = null;
    saveCues();
    renderCues();
  }

  // Lands at `cue.t - lead` and holds paused: you want the couple of seconds
  // before the fight to set it up verbally, not to arrive mid-explosion.
  function seekToCue(index) {
    const cue = cues[index];
    if (!cue) return;
    activeCueIndex = index;
    const lead = typeof cue.lead === 'number' ? cue.lead : DEFAULT_LEAD;
    requestSeek(Math.max(0, cue.t - lead), { holdPaused: true, keepCueCursor: true });
    renderCues();
  }

  // Steps a cursor rather than searching by time. After landing at
  // `cue.t - lead` the playhead sits *before* the cue it just moved to, so a
  // time-based "next cue after now" would find the same cue again and never
  // advance. The cursor is cleared by any seek the user makes another way,
  // which is what re-syncs it to wherever they scrubbed to.
  function gotoCue(direction) {
    if (!cues.length) return;
    let index;
    if (activeCueIndex !== null && cues[activeCueIndex]) {
      index = activeCueIndex + direction;
    } else if (direction > 0) {
      index = cues.findIndex((c) => c.t > getDisplayTime() + 0.5);
    } else {
      const now = getDisplayTime();
      index = -1;
      for (let i = cues.length - 1; i >= 0; i--) {
        if (cues[i].t < now - 0.5) {
          index = i;
          break;
        }
      }
    }
    if (index < 0 || index >= cues.length) return;
    seekToCue(index);
  }

  function setLoopPoint(which) {
    if (which === 'a') loopA = getDisplayTime();
    else loopB = getDisplayTime();
    renderLoop();
  }

  function toggleLoop() {
    if (!loopRange()) return;
    loopEnabled = !loopEnabled;
    renderLoop();
  }

  function clearLoop() {
    loopA = null;
    loopB = null;
    loopEnabled = false;
    renderLoop();
  }

  // Driven by the same ~10Hz playback push the transport uses — no second
  // timer, and no second seek path. Deliberately inert while paused: pausing
  // mid-loop must neither cancel the loop nor wrap it.
  function checkLoop() {
    if (!loopEnabled || lastPolled.paused || seekRunning) return;
    const range = loopRange();
    if (!range) return;
    if (lastPolled.time >= range.end) {
      requestSeek(range.start, { keepCueCursor: true });
    }
  }

  function renderLoop() {
    const length = lastPolled.length || 0;
    const pct = (t) => (length > 0 ? clamp((t / length) * 100, 0, 100) : 0);
    const range = loopRange();

    loopEdgeAEl.classList.toggle('visible', loopA !== null && length > 0);
    if (loopA !== null) loopEdgeAEl.style.left = `${pct(loopA)}%`;
    loopEdgeBEl.classList.toggle('visible', loopB !== null && length > 0);
    if (loopB !== null) loopEdgeBEl.style.left = `${pct(loopB)}%`;

    if (range && length > 0) {
      loopRegionEl.style.left = `${pct(range.start)}%`;
      loopRegionEl.style.width = `${pct(range.end) - pct(range.start)}%`;
      loopRegionEl.classList.add('visible');
      loopRegionEl.classList.toggle('armed', loopEnabled);
    } else {
      loopRegionEl.classList.remove('visible', 'armed');
    }

    const label = range
      ? `Loop ${formatTime(range.start)}–${formatTime(range.end)}${loopEnabled ? ' ⟲' : ' (off)'}`
      : '';
    loopChipEl.textContent = label;
    loopChipEl.classList.toggle('visible', !!label);
    loopChipEl.classList.toggle('armed', loopEnabled);
  }

  function renderCuePins() {
    const length = lastPolled.length || 0;
    cuePinsEl.replaceChildren();
    if (length <= 0) return;

    cues.forEach((cue, index) => {
      const pin = document.createElement('div');
      pin.className = 'cue-pin';
      if (cue.note) pin.classList.add('noted');
      if (index === activeCueIndex) pin.classList.add('active');
      pin.style.left = `${clamp((cue.t / length) * 100, 0, 100)}%`;

      pin.addEventListener('mousedown', (e) => e.stopPropagation());
      pin.addEventListener('mousemove', (e) => e.stopPropagation());
      pin.addEventListener('click', (e) => {
        e.stopPropagation();
        seekToCue(index);
      });
      pin.addEventListener('mouseenter', () => {
        hideGhost(); // the pin sits under the track; the ghost line here is just noise
        openHoverCard(pinPixelX(pin), [buildCueCardRow(cue, index)], pin);
      });
      pin.addEventListener('mouseleave', scheduleHideHoverCard);
      cuePinsEl.appendChild(pin);
    });
  }

  function pinPixelX(pin) {
    return pin.getBoundingClientRect().left + pin.offsetWidth / 2 - scrubTrack.getBoundingClientRect().left;
  }

  function buildCueCardRow(cue, index) {
    const row = document.createElement('div');
    row.className = 'hc-row';

    const dot = document.createElement('div');
    dot.className = 'hc-dot';
    dot.style.background = 'var(--cue)';
    row.appendChild(dot);

    const label = document.createElement('div');
    label.className = 'hc-label';
    label.textContent = cue.note || `Cue ${index + 1}`;
    row.appendChild(label);

    const time = document.createElement('div');
    time.className = 'hc-time';
    time.textContent = formatTime(cue.t);
    row.appendChild(time);

    row.addEventListener('click', (e) => {
      e.stopPropagation();
      hideHoverCard();
      seekToCue(index);
    });
    return row;
  }

  function renderCueList() {
    cuesToggleEl.textContent = `Cues (${cues.length}) ${cuesExpanded ? '▾' : '▸'}`;
    cuesListEl.replaceChildren();

    if (!cues.length) {
      const empty = document.createElement('div');
      empty.className = 'cue-empty';
      empty.textContent = 'No cues yet — press M while watching to drop one.';
      cuesListEl.appendChild(empty);
    }

    cues.forEach((cue, index) => {
      const row = document.createElement('div');
      row.className = `cue-row${index === activeCueIndex ? ' active' : ''}`;

      const num = document.createElement('span');
      num.className = 'cue-num';
      num.textContent = String(index + 1);
      row.appendChild(num);

      const time = document.createElement('span');
      time.className = 'cue-time';
      time.textContent = formatTime(cue.t);
      time.title = 'Jump to this cue';
      time.addEventListener('click', () => seekToCue(index));
      row.appendChild(time);

      // Notes are edited in place and never block placement — typing here only
      // repaints the pins, so the field keeps focus while you write.
      const note = document.createElement('input');
      note.className = 'cue-note';
      note.value = cue.note || '';
      note.placeholder = 'note…';
      note.addEventListener('input', () => {
        cue.note = note.value;
        saveCues();
        renderCuePins();
      });
      note.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === 'Escape') note.blur();
      });
      row.appendChild(note);

      const del = document.createElement('button');
      del.className = 'cue-del';
      del.textContent = '×';
      del.title = 'Delete cue';
      del.addEventListener('click', () => deleteCue(index));
      row.appendChild(del);

      cuesListEl.appendChild(row);
    });

    cuesListEl.appendChild(exportAreaEl);

    const actions = document.createElement('div');
    actions.className = 'cue-actions';

    const exportBtn = document.createElement('button');
    exportBtn.textContent = 'Copy as text';
    exportBtn.disabled = cues.length === 0;
    exportBtn.addEventListener('click', () => exportCues(exportBtn));
    actions.appendChild(exportBtn);

    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'Clear all';
    clearBtn.disabled = cues.length === 0;
    clearBtn.addEventListener('click', () => {
      cues = [];
      activeCueIndex = null;
      saveCues();
      renderCues();
    });
    actions.appendChild(clearBtn);

    cuesListEl.appendChild(actions);
  }

  function renderCues() {
    renderCuePins();
    renderCueList();
  }

  // `MM:SS — note`, one line per cue. This exact shape is the point: it pastes
  // straight into a YouTube description as chapter markers.
  function cuesAsText() {
    // A cue with no note emits just the timestamp — the brief's `MM:SS — note`
    // shape with an empty note would leave a dangling separator on every line
    // you'd then have to clean out of a YouTube description by hand.
    return cues.map((c) => (c.note ? `${formatTime(c.t)} — ${c.note}` : formatTime(c.t))).join('\n');
  }

  // Export always puts the text on screen, selected, and only *then* tries the
  // clipboard. `navigator.clipboard.writeText` needs transient user activation
  // and can be refused for reasons the page can't see, so making the copy the
  // only delivery would mean an export that silently does nothing. With the
  // textarea there, Ctrl+C always works even when the API says no.
  async function exportCues(button) {
    const text = cuesAsText();
    exportAreaEl.value = text;
    exportAreaEl.classList.add('visible');
    exportAreaEl.focus();
    exportAreaEl.select();

    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (err) {
      copied = false;
    }
    button.textContent = copied ? 'Copied ✓' : 'Selected — Ctrl+C';
    setTimeout(() => {
      button.textContent = 'Copy as text';
    }, 2000);
  }

  cuesToggleEl.addEventListener('click', () => {
    cuesExpanded = !cuesExpanded;
    cuesPanelEl.classList.toggle('expanded', cuesExpanded);
    renderCueList();
  });

  // --- Playback writes ---

  async function postPlayback(body) {
    const res = await fetch('/api/replay/playback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`status_${res.status}`);
    return res.json();
  }

  // The client silently drops a "paused: false" write that arrives while it's still settling
  // from a seek — confirmed directly: the unpause response itself came back still paused. Wait
  // for the polled `seeking` flag to clear before sending it.
  async function waitForSeekSettled(maxWaitMs = 1500) {
    // Fetches fresh state directly rather than reading lastPolled — the passive WS broadcast
    // lags just enough that lastPolled.seeking can still show the stale pre-seek value here.
    const start = Date.now();
    while (Date.now() - start < maxWaitMs) {
      try {
        const state = await fetch('/api/replay/playback').then((r) => r.json());
        if (!state.seeking) return;
      } catch (err) {
        // Keep trying until the timeout.
      }
      await new Promise((resolve) => setTimeout(resolve, 80));
    }
  }

  // `holdPaused` leaves playback paused after landing instead of restoring the
  // previous play state. Cue navigation needs that, and it has to happen inside
  // this function: a separate pause write afterwards would be a second path
  // through the mutex and could interleave with the seek's own resume.
  async function doSeek(target, holdPaused) {
    return withMutex(async () => {
      const wasPlaying = !lastPolled.paused;
      try {
        await postPlayback({ paused: true });
        await postPlayback({ time: target });
        if (wasPlaying && !holdPaused) {
          await waitForSeekSettled();
          await postPlayback({ paused: false });
        }
      } catch (err) {
        // Next poll tick reconciles the UI regardless.
      }
    });
  }

  async function requestSeek(target, options = {}) {
    // Any seek that isn't cue navigation breaks the cue cursor — the user has
    // moved somewhere of their own accord, so N should re-derive from position.
    if (!options.keepCueCursor) activeCueIndex = null;

    const length = lastPolled.length || 0;
    pendingSeekTarget = clamp(target, 0, length);
    pendingSeekHold = !!options.holdPaused;
    if (seekRunning) return;
    seekRunning = true;
    try {
      while (pendingSeekTarget !== null) {
        currentSeekTarget = pendingSeekTarget;
        const holdPaused = pendingSeekHold;
        pendingSeekTarget = null;
        renderTransport();
        await doSeek(currentSeekTarget, holdPaused);
      }
    } finally {
      seekRunning = false;
      currentSeekTarget = null;
      renderTransport();
    }
  }

  async function togglePause() {
    return withMutex(async () => {
      try {
        await postPlayback({ paused: !lastPolled.paused });
      } catch (err) {
        // Poll tick reconciles.
      }
    });
  }

  async function setSpeed(value) {
    optimisticSpeed = value;
    renderTransport();
    return withMutex(async () => {
      try {
        await postPlayback({ speed: value });
      } catch (err) {
        optimisticSpeed = null;
        renderTransport();
      }
    });
  }

  // --- Scrub interaction ---

  // Matches the marker's 16px hit target: if the cursor is over a marker you get
  // that event, otherwise you get the raw position. A wider radius sounds more
  // helpful but a kill-heavy game packs markers ~15px apart, and snapping then
  // covers most of the bar and fights precise scrubbing.
  const SNAP_PX = 8;

  // Magnetic snap: within SNAP_PX of a marker, a click lands on the event
  // rather than wherever the cursor happened to be. Alt suppresses it for
  // precise scrubbing.
  function targetFromEvent(e) {
    const rect = scrubTrack.getBoundingClientRect();
    const length = lastPolled.length || 0;
    const px = clamp(e.clientX - rect.left, 0, rect.width);
    let time = rect.width > 0 ? (px / rect.width) * length : 0;

    let cluster = null;
    if (!e.altKey && length > 0) {
      let bestDistance = Infinity;
      for (const candidate of markerClusters) {
        const distance = Math.abs(candidate.pxX - px);
        if (distance < bestDistance) {
          bestDistance = distance;
          cluster = candidate;
        }
      }
      if (bestDistance > SNAP_PX) cluster = null;
    }
    if (cluster) time = cluster.time;

    return { time, cluster, px: cluster ? cluster.pxX : px, trackWidth: rect.width };
  }

  let ghostCluster = null;

  function showGhost(target) {
    scrubGhostEl.style.left = `${target.px}px`;
    scrubGhostEl.classList.add('visible');
    scrubGhostEl.classList.toggle('snapped', !!target.cluster);
    scrubGhostEl.classList.toggle('flip', target.px > target.trackWidth - 70);
    ghostTimeEl.textContent = formatTime(target.time);

    if (ghostCluster !== target.cluster) {
      if (ghostCluster && ghostCluster !== hoverCluster) ghostCluster.el.classList.remove('hot');
      ghostCluster = target.cluster;
      if (ghostCluster) ghostCluster.el.classList.add('hot');
    }
  }

  function hideGhost() {
    scrubGhostEl.classList.remove('visible', 'snapped', 'flip');
    if (ghostCluster && ghostCluster !== hoverCluster) ghostCluster.el.classList.remove('hot');
    ghostCluster = null;
  }

  function onDragMove(e) {
    const target = targetFromEvent(e);
    dragPreviewTime = target.time;
    showGhost(target);
    renderTransport();
  }

  function onDragEnd(e) {
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    const target = dragPreviewTime;
    isDragging = false;
    dragPreviewTime = null;
    hideGhost();
    if (target !== null) requestSeek(target);
  }

  scrubTrack.addEventListener('mousedown', (e) => {
    if (currentState !== 'connected') return;
    const target = targetFromEvent(e);
    isDragging = true;
    dragPreviewTime = target.time;
    showGhost(target);
    renderTransport();
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  });

  scrubTrack.addEventListener('mousemove', (e) => {
    if (currentState !== 'connected' || isDragging) return;
    showGhost(targetFromEvent(e));
  });

  scrubTrack.addEventListener('mouseleave', () => {
    if (!isDragging) hideGhost();
  });

  // --- Buttons ---

  pauseBtn.addEventListener('click', () => {
    if (currentState !== 'connected') return;
    togglePause();
  });

  speedPresets.addEventListener('click', (e) => {
    const btn = e.target.closest('.speed-btn');
    if (!btn || currentState !== 'connected') return;
    setSpeed(Number(btn.dataset.speed));
  });

  // --- Keyboard ---

  document.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    const tag = active && active.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (active && active.isContentEditable)) return;
    if (currentState !== 'connected') return;

    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
      e.preventDefault();
      requestSeek(getDisplayTime() + (e.shiftKey ? -1 : -5));
    } else if (e.key === 'ArrowRight' || e.key === 'Right') {
      e.preventDefault();
      requestSeek(getDisplayTime() + (e.shiftKey ? 1 : 5));
    } else if (e.key === ',' || e.key === '<') {
      e.preventDefault();
      stepEvent(-1);
    } else if (e.key === '.' || e.key === '>') {
      e.preventDefault();
      stepEvent(1);
    } else if (e.key === 'm' || e.key === 'M') {
      e.preventDefault();
      placeCue();
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      gotoCue(1);
    } else if (e.key === 'b' || e.key === 'B') {
      e.preventDefault();
      gotoCue(-1);
    } else if (e.key === '[') {
      e.preventDefault();
      setLoopPoint('a');
    } else if (e.key === ']') {
      e.preventDefault();
      setLoopPoint('b');
    } else if (e.key === 'l' || e.key === 'L') {
      e.preventDefault();
      toggleLoop();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      clearLoop();
    }
  });

  // --- WebSocket connection ---

  let ws;
  let reconnectTimer;

  function connect() {
    ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      setState('no-replay', 'Helper up, waiting for replay…');
    };

    ws.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (msg.type === 'roster') {
        checkGameChange(msg.processID);
        cameraState = msg.camera || { attached: false, selectionName: null };
        renderRoster(msg.players || []);
        return;
      }

      if (msg.type === 'events') {
        checkGameChange(msg.processID);
        mergeEvents(msg.events || []);
        return;
      }

      if (msg.type !== 'playback') return;

      if (msg.state === 'connected') {
        const wasConnected = currentState === 'connected';
        setState('connected', 'Connected');
        lastPolled = msg.playback;
        if (optimisticSpeed !== null && Math.abs(lastPolled.speed - optimisticSpeed) < 0.001) {
          optimisticSpeed = null;
        }
        renderTransport();
        checkLoop();
        if (!wasConnected) handleNewGame();
      } else {
        setState('no-replay', 'No replay loaded');
        clearTransportDisplay();
        clearRosterDisplay();
        clearEventsDisplay();
        clearCuesDisplay();
        gameModeKnown = false;
        gameModeEl.textContent = '—';
        lastProcessId = null;
      }
    };

    ws.onclose = () => {
      setState('helper-down', 'Helper unreachable — retrying…');
      clearTransportDisplay();
      clearRosterDisplay();
      clearEventsDisplay();
      clearCuesDisplay();
      gameModeKnown = false;
      gameModeEl.textContent = '—';
      lastProcessId = null;
      reconnectTimer = setTimeout(connect, 1000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  // Clustering is computed in pixels, so the markers are only correct for the
  // width they were measured at. A window resize listener misses the cases that
  // actually bite — the panel laid out at ~0px in a background tab, or the
  // events dropdown changing the track's share of the row — so watch the track
  // itself. Markers don't affect the track's box, so this can't feed back.
  function remeasureMarkers() {
    if (lastPolled.length <= 0) return;
    const width = scrubTrack.getBoundingClientRect().width;
    if (width <= 0 || Math.abs(width - lastMarkerTrackWidth) < 1) return;
    renderMarkers();
    renderCuePins();
  }

  new ResizeObserver(remeasureMarkers).observe(scrubTrack);

  // The observer alone isn't enough: its callbacks are delivered on the
  // rendering loop, which browsers suspend for a hidden tab. Open the panel on
  // a background monitor tab and it lays out at ~0px wide, every event collapses
  // into one cluster, and nothing ever re-measures. Confirmed live. This poll
  // costs one layout read per second and closes that hole.
  setInterval(remeasureMarkers, 1000);

  connect();
  renderTransport();
</script>
</body>
</html>
