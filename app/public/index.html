<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LoL Replay Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14171c;
    --border: #262b33;
    --text: #e6e9ef;
    --dim: #8891a0;
    --ok: #37d67a;
    --warn: #e0b23c;
    --bad: #e05c5c;
    --accent: #4d8dff;
    /* Team colours. Blue/red on this panel always mean ORDER/CHAOS - never a
       category - which is why structures moved off the accent blue below. */
    --blue: #4d8dff;
    --red: #e0576b;
    /* Event categories. */
    --kill: #e05c5c;
    --obj: #e0b23c;
    --struct: #7f8ea3;
    /* Cue points and the A/B loop (brief 005). Deliberately outside the event
       palette and outside blue/red, so a cue can never be misread as an event
       marker or a team. */
    --cue: #2fd4c6;
    --loop: #a97bff;
    /* One spacing scale (brief 015), applied instead of per-element nudges -
       the complaint was inconsistency, not any one wrong number. */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }

  /* Roster - a card like every other top-level block (brief 015), so the
     panel reads as a consistent stack rather than one loose section among
     bordered ones. */
  .roster {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    width: 100%;
    transition: opacity 0.15s ease;
  }
  .roster.disabled {
    opacity: 0.4;
    pointer-events: none;
  }
  /* Scene controls (brief 006). These live in the status bar: Cinematic is
     pressed during a take and Setup is the door to everything that isn't. */
  .scene-controls {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    transition: opacity 0.15s ease;
  }
  .scene-controls.disabled {
    opacity: 0.4;
    pointer-events: none;
  }
  .cinematic-btn {
    flex: 0 0 auto;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 7px;
  }
  .cinematic-btn.active {
    background: var(--warn);
    color: #1a1206;
    border-color: var(--warn);
  }
  /* The HUD toggles are configuration, not live control - you set your HUD once
     and then leave it alone. Cinematic is the button you actually press during
     a take, so it stays out here and the 17 chips live behind Setup. */
  .setup-toggle {
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 7px;
  }
  .setup-toggle.open {
    border-color: var(--accent);
    color: var(--accent);
  }
  .scene-setup {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .scene-setup[hidden] { display: none; }
  .setup-group {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
  }
  .toggle-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex: 1;
  }
  .toggle-chip {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #0b0d10;
    color: var(--dim);
    cursor: pointer;
  }
  .toggle-chip.on {
    color: var(--text);
    border-color: #3d4756;
    background: #171c23;
  }
  .toggle-chip.off {
    color: #5d6675;
    text-decoration: line-through;
  }
  .control-sep {
    width: 1px;
    align-self: stretch;
    background: var(--border);
    margin: 0 2px;
  }

  /* Camera distance lives in the status bar next to Cinematic - it is adjusted
     while watching, so it belongs with the other live controls. */
  .camera-bar-label {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .scene-controls input[type='range'] {
    flex: 0 0 130px;
    accent-color: var(--ok);
    cursor: pointer;
    vertical-align: middle;
  }
  .camera-bar-value {
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    color: var(--text);
    min-width: 38px;
  }
  /* Two-row fallback (brief 015): the single-row-of-ten primary approach was
     built and measured first - at 1400px a card had ~115px total, leaving
     ~37px for all of champion + summoner + KDA text after the portrait, gap
     and padding. That's not "cleanly ellipsised," it's unreadable, so this
     is the documented fallback: smaller portrait, tighter padding, the hint
     moved to a `title` attribute instead of its own line. Still two rows,
     like before this brief, just denser than they were. */
  .roster-block {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .roster-block-label {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--dim);
    padding-left: 2px;
  }
  .roster-list {
    display: flex;
    flex-direction: row;
    gap: var(--space-2);
  }
  /* Portrait beside the text, not above it. Stacked, the card was mostly empty
     space to the left and right of the image. */
  .roster-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--space-2);
    flex: 1 1 0;
    max-width: 240px;
    min-width: 0;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: var(--space-1) var(--space-2);
    cursor: pointer;
    text-align: left;
  }
  /* Two controls in one card: the portrait locks the camera, the text selects
     the target frame. They were one click before, which conflated the in-game
     single-click (frame) and double-click (camera) behaviours. */
  .roster-item.cam-locked {
    border-color: var(--ok);
    background: rgba(55, 214, 122, 0.12);
  }
  .roster-item.frame-selected {
    border-color: var(--accent);
    background: rgba(77, 141, 255, 0.1);
  }
  /* 32px, down from 44px - part of the two-row fallback's "smaller portrait". */
  .roster-portrait-wrap {
    position: relative;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  .roster-portrait-wrap:hover {
    outline: 2px solid var(--ok);
    outline-offset: 2px;
  }
  .roster-cam-hint {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: rgba(6, 12, 18, 0.62);
    color: var(--ok);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.12s ease;
    pointer-events: none;
  }
  .roster-portrait-wrap:hover .roster-cam-hint { opacity: 1; }
  .roster-item.cam-locked .roster-portrait-wrap {
    outline: 2px solid var(--ok);
    outline-offset: 2px;
  }
  .roster-info {
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 4px;
    margin: -2px -4px;
    min-width: 0;
    flex: 1;
  }
  .roster-info:hover {
    background: rgba(77, 141, 255, 0.14);
  }
  .roster-portrait {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    object-fit: cover;
    background: var(--panel);
  }
  .roster-portrait-fallback {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--dim);
  }
  .roster-champ {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roster-name {
    font-size: 10px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roster-stats {
    font-size: 10px;
    color: var(--dim);
    font-family: "Consolas", "Cascadia Mono", monospace;
    white-space: nowrap;
  }

  .panel {
    width: 100%;
    /* Monitor 2 is a whole screen; a 720px column left most of it as dead
       space. Wider also means more pixels per minute on the scrub track, which
       is what separates markers in a kill-heavy game. */
    max-width: 1400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  /* Every functional group gets its own inset card, so the panel reads as
     status / timeline / controls / roster rather than one long column. */
  .card {
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: var(--space-3) var(--space-4);
  }

  .statusbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--dim);
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bad);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .dot.connected { background: var(--ok); }
  .dot.no-replay { background: var(--warn); }
  .dot.helper-down { background: var(--bad); }

  .status-text {
    font-weight: 600;
    color: var(--text);
  }

  .chips {
    display: flex;
    gap: 8px;
  }
  .chip {
    font-size: 12px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    letter-spacing: 0.04em;
    color: var(--dim);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .chip.mode { text-transform: uppercase; }
  .chip.playing {
    color: #9fe8bd;
    border-color: rgba(55, 214, 122, 0.35);
  }
  .chip.is-paused {
    color: var(--warn);
    border-color: rgba(224, 178, 60, 0.35);
  }

  /* Transport */
  /* One card with hairline-separated sections rather than three stacked cards.
     The controls, the bar they drive and the cue row are one instrument; three
     separate borders made them read as three unrelated panels. */
  .transport {
    display: flex;
    flex-direction: column;
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  .transport.card {
    gap: 0;
    padding: 0;
    overflow: hidden;
  }
  .transport > * {
    padding: var(--space-3) var(--space-4);
  }
  .transport > * + * {
    border-top: 1px solid var(--border);
  }
  .transport.disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .timeline-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .scrub-area {
    position: relative;
    flex: 1;
    min-width: 0;
    /* Space above the track for the event marker gutter. Cue pins (brief 005)
       get the strip *below* the track, so the two never share a lane. */
    padding-top: 40px;
  }
  .scrub-track {
    position: relative;
    height: 42px;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  .scrub-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: var(--accent);
    opacity: 0.3;
    border-radius: 10px 0 0 10px;
    pointer-events: none;
  }

  /* Minute ticks - without these, "18:42" has nothing to be 18:42 *of*. */
  .scrub-ticks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 10px;
  }
  .tick {
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 7px;
    background: rgba(230, 233, 239, 0.13);
  }
  .tick.major {
    height: 13px;
    background: rgba(230, 233, 239, 0.28);
  }
  .tick-label {
    position: absolute;
    bottom: 14px;
    transform: translateX(-50%);
    font-size: 9px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    color: rgba(230, 233, 239, 0.38);
    white-space: nowrap;
  }

  /* Event markers (brief 004) - three lanes so events that collide in time
     stop colliding in pixels. Clustering runs per lane. */
  .scrub-markers {
    position: absolute;
    left: 0;
    right: 0;
    top: -34px;
    height: 34px;
  }
  .marker {
    position: absolute;
    width: 4px;
    height: 9px;
    border-radius: 2px;
    transform: translateX(-50%);
    cursor: pointer;
    opacity: 0.58;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  /* Invisible 16px hit target - the drawn marker stays thin. */
  .marker::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -4px;
    transform: translateX(-50%);
    width: 16px;
    height: 17px;
  }
  .marker.lane0 { top: 2px; }
  .marker.lane1 { top: 14px; }
  .marker.lane2 { top: 25px; }
  .marker.kill { background: var(--kill); }
  .marker.objective { background: var(--obj); }
  .marker.tower { background: var(--struct); }
  .marker.unknown { background: var(--dim); }
  .marker.ace {
    background: #fff;
    top: 0;
    height: 12px;
    width: 5px;
  }
  /* Clustered markers grow from their left edge, not centred - the left edge
     is the first event's real time (brief 014), and a centred wide cluster
     would visually claim territory before that time even happened. */
  .marker.cluster {
    transform: translateX(0);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marker-count {
    font-size: 8px;
    font-weight: 700;
    line-height: 1;
    color: rgba(6, 18, 31, 0.75);
    pointer-events: none;
    user-select: none;
  }
  .marker.past { opacity: 1; }
  .marker.hot,
  .marker:hover {
    opacity: 1;
    transform: translateX(-50%) scaleY(1.35);
  }
  .marker.cluster.hot,
  .marker.cluster:hover {
    transform: translateX(0) scaleY(1.35);
  }
  .marker.active {
    opacity: 1;
    outline: 2px solid rgba(255, 255, 255, 0.9);
    outline-offset: 1px;
  }
  .marker .cap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 3px;
    border-radius: 2px 2px 0 0;
  }
  .marker .cap.order { background: var(--blue); }
  .marker .cap.chaos { background: var(--red); }

  /* Hover card - replaces native title tooltips. For a cluster it lists every
     event, each seeking to its own timestamp: before this, only the first
     event in a cluster was reachable at all. */
  .hover-card {
    position: absolute;
    left: 0;
    top: 2px;
    transform: translate(-50%, -100%);
    z-index: 40;
    display: none;
    min-width: 210px;
    max-width: 360px;
    max-height: 240px;
    overflow-y: auto;
    background: #12161c;
    border: 1px solid #2f3742;
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
  }
  .hover-card.visible { display: block; }
  .hc-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 7px;
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  .hc-row:hover { background: rgba(255, 255, 255, 0.06); }
  .hc-row.order { border-left-color: var(--blue); }
  .hc-row.chaos { border-left-color: var(--red); }
  .hc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .hc-dot.kill { background: var(--kill); }
  .hc-dot.objective { background: var(--obj); }
  .hc-dot.tower { background: var(--struct); }
  .hc-dot.unknown { background: var(--dim); }
  .hc-dot.ace { background: #fff; }
  .hc-portraits {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .hc-portrait {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    object-fit: cover;
    background: #0f1216;
  }
  .hc-portrait.victim {
    opacity: 0.7;
    filter: grayscale(0.6);
  }
  .hc-arrow {
    font-size: 10px;
    color: var(--dim);
  }
  .hc-label {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hc-time {
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    color: var(--dim);
    flex-shrink: 0;
  }

  /* Ghost playhead - preview of where a click would land, with magnetic snap. */
  .scrub-ghost {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1px dashed rgba(230, 233, 239, 0.5);
    pointer-events: none;
    display: none;
    z-index: 3;
  }
  .scrub-ghost.visible { display: block; }
  .scrub-ghost.snapped { border-left: 1px solid var(--accent); }
  .ghost-time {
    position: absolute;
    top: 5px;
    left: 6px;
    font-size: 11px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    color: var(--text);
    background: rgba(10, 12, 15, 0.92);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  .scrub-ghost.flip .ghost-time {
    left: auto;
    right: 6px;
  }
  .scrub-ghost.snapped .ghost-time { border-color: var(--accent); }

  /* --- Cue points + A/B loop (brief 005) --- */

  /* Cues live in the strip *below* the track; brief 004's event markers live in
     the gutter above it. Different side, different shape, different colour -
     two marker types on one bar must not be confusable. */
  .cue-pins {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: 15px;
  }
  .cue-pin {
    position: absolute;
    top: 0;
    width: 2px;
    height: 15px;
    background: var(--cue);
    transform: translateX(-50%);
    cursor: pointer;
  }
  /* Pin head, and a 16px hit target around the whole thing. */
  .cue-pin::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--cue);
  }
  .cue-pin::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -2px;
    transform: translateX(-50%);
    width: 16px;
    height: 19px;
  }
  .cue-pin.noted::after {
    border-radius: 2px;
  }
  .cue-pin:hover,
  .cue-pin.hot {
    background: #fff;
  }
  .cue-pin:hover::after,
  .cue-pin.hot::after {
    background: #fff;
  }
  .cue-pin.active::after {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
  }

  .loop-region {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(169, 123, 255, 0.16);
    border-left: 1px solid var(--loop);
    border-right: 1px solid var(--loop);
    pointer-events: none;
    display: none;
    z-index: 2;
  }
  .loop-region.visible { display: block; }
  .loop-region.armed { background: rgba(169, 123, 255, 0.3); }
  .loop-edge {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--loop);
    pointer-events: none;
    display: none;
    z-index: 2;
  }
  .loop-edge.visible { display: block; }
  .loop-edge::after {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 9px;
    font-weight: 700;
    color: var(--loop);
  }
  .loop-edge.a::after { content: 'A'; }
  .loop-edge.b::after { content: 'B'; }

  .chip.loop {
    color: #d8c2ff;
    border-color: rgba(169, 123, 255, 0.45);
    display: none;
  }
  .chip.loop.visible { display: inline; }
  .chip.loop.armed {
    background: rgba(169, 123, 255, 0.18);
  }

  /* Hotkeys only reach the panel while it has focus, which it usually doesn't
     while the replay client holds it on the other monitor. This says why a
     keypress just did nothing, rather than reading as a broken panel. */
  .chip.focus {
    color: var(--warn);
    border-color: rgba(224, 178, 60, 0.35);
    display: none;
  }
  .chip.focus.visible { display: inline; }

  /* Command buttons - one visual language for every clickable action, each
     carrying its own hotkey so the two input methods read as the same thing. */
  .cmd-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cmd-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
  }
  .cmd-key {
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 9px;
    color: var(--dim);
    background: #0b0d10;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 4px;
  }
  .cmd-btn.on {
    background: var(--cue);
    border-color: var(--cue);
    color: #062120;
  }
  .cmd-btn.on .cmd-key {
    color: #062120;
    background: rgba(255, 255, 255, 0.35);
    border-color: transparent;
  }
  .cmd-btn:disabled .cmd-key { opacity: 0.6; }

  .cue-controls {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  .cue-controls-label {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* Cues card - every cue shown expanded at once (not one at a time behind a
     click), in its own top-level card rather than a rail tab. Placing a cue
     grows this list, and the page, downward. */
  .cues-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .cues-card-head {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .cues-card-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .cues-action-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 7px;
  }
  .cues-action-btn:first-of-type {
    margin-left: auto;
  }
  .cues-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .cues-empty {
    padding: var(--space-2);
    font-size: 12px;
    color: var(--dim);
  }
  .cue-block {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0f1216;
  }
  /* Which cue B/N navigation is currently on - not tied to which field has
     focus, since clicking into a note to fix a typo shouldn't relocate the
     nav cursor. Only seeking to a cue (the timestamp, or B/N) moves it. */
  .cue-block.active { border-color: var(--cue); }
  .cue-block-head {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .cue-num {
    flex-shrink: 0;
    width: 18px;
    text-align: right;
    font-size: 10px;
    color: var(--dim);
  }
  .cue-time {
    flex-shrink: 0;
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 12px;
    color: var(--cue);
    cursor: pointer;
  }
  .cue-lead-label {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
  }
  .cue-lead {
    width: 44px;
    background: #0b0d10;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 5px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .cue-del {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--dim);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .cue-del:hover {
    color: var(--bad);
    border-color: var(--border);
  }
  /* Label on the left, notes on the right - a short line beside the
     paragraph it labels, not stacked above it. */
  .cue-block-body {
    display: flex;
    gap: var(--space-3);
  }
  .cue-label {
    flex: 0 0 220px;
    min-width: 0;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    align-self: flex-start;
  }
  .cue-label:hover { border-color: #3d4756; }
  .cue-label:focus {
    outline: none;
    border-color: var(--accent);
    background: #0b0d10;
  }
  .cue-notes {
    flex: 1;
    min-width: 0;
    min-height: 52px;
    max-height: 200px;
    resize: vertical;
    background: #0b0d10;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    line-height: 1.5;
  }
  .cue-notes:focus {
    outline: none;
    border-color: var(--accent);
  }
  .cue-export {
    display: none;
    width: 100%;
    height: 90px;
    resize: vertical;
    background: #0b0d10;
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 6px 8px;
    color: var(--text);
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    line-height: 1.5;
  }
  .cue-export.visible { display: block; }

  .legend {
    display: flex;
    gap: 14px;
    margin-top: 7px;
    font-size: 10px;
    color: var(--dim);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 2px;
  }
  .legend-dot.kill { background: var(--kill); }
  .legend-dot.objective { background: var(--obj); }
  .legend-dot.tower { background: var(--struct); }
  .legend-dot.ace { background: #fff; }
  .legend-dot.cue {
    background: var(--cue);
    border-radius: 50%;
  }
  /* Persistent rail. Replaces the floating dropdowns from briefs 004/005 - at
     1400px wide they opened straight over the scrub track, hiding the bar you
     were about to click. */
  .rail {
    display: flex;
    flex-direction: column;
    width: 330px;
    flex-shrink: 0;
    background: #0b0d10;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .rail-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .rail-tab {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--dim);
  }
  .rail-tab.active {
    color: var(--text);
    background: #141920;
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .rail-body {
    display: flex;
    flex-direction: column;
    gap: 3px;
    height: 196px;
    overflow-y: auto;
    padding: 6px;
  }
  .rail-body[hidden] { display: none; }
  .event-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .event-row:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  .event-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .event-dot.kill { background: var(--bad); }
  .event-dot.objective { background: var(--warn); }
  .event-dot.tower { background: var(--accent); }
  .event-dot.unknown { background: var(--dim); }
  .event-dot.ace { background: #fff; }
  .event-label {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-time {
    color: var(--dim);
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    flex-shrink: 0;
  }

  .scrub-handle {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 6px;
    left: 0%;
    transform: translateX(-3px);
    background: var(--accent);
    border-radius: 3px;
    pointer-events: none;
    z-index: 4;
  }
  /* Seeks lag 100–200ms. Without this the handle jumps to the optimistic target
     and looks settled, which invites a second click on a seek already running. */
  .scrub-handle.seeking {
    background: #9dc0ff;
    box-shadow: 0 0 0 3px rgba(77, 141, 255, 0.35);
  }
  @media (prefers-reduced-motion: no-preference) {
    .scrub-handle.seeking { animation: seek-pulse 0.7s ease-in-out infinite; }
  }
  @keyframes seek-pulse {
    50% { box-shadow: 0 0 0 6px rgba(77, 141, 255, 0.12); }
  }
  .handle-time {
    position: absolute;
    /* Clears the 15px cue-pin strip that sits directly under the track. */
    top: calc(100% + 18px);
    left: 50%;
    transform: translateX(-50%);
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 11px;
    color: var(--text);
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 5px;
    white-space: nowrap;
  }
  /* At 0% / 100% a centred bubble hangs off the track and over the events
     column, so pin it to the handle's edge instead. */
  .handle-time.clamp-start {
    left: 0;
    transform: none;
  }
  .handle-time.clamp-end {
    left: auto;
    right: 0;
    transform: none;
  }

  .time-readout {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-family: "Consolas", "Cascadia Mono", monospace;
    font-size: 14px;
    color: var(--dim);
    /* Clears the cue-pin strip and the handle's time bubble below the track. */
    margin-top: 39px;
  }
  .time-next {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .time-next.soon { color: var(--warn); }

  .transport-controls {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  button {
    font-size: 15px;
    font-weight: 600;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #0f1216;
    color: var(--text);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .pause-btn {
    flex: 0 0 120px;
    background: var(--accent);
    color: #06121f;
  }

  /* Fixed-width rather than flex:1 - stretched across a 1340px card the speed
     buttons were ~230px each, which reads as five giant slabs. */
  .speed-presets {
    display: flex;
    gap: 8px;
  }
  .speed-btn {
    flex: 0 0 76px;
    position: relative;
  }
  /* The recommended narration speed used to draw an accent border, which read
     as "selected" at the same time as the actually-active button's fill. Now a
     dot, so only one button can look active. */
  .speed-btn.primary::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 4px;
    transform: translateX(-50%);
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--dim);
  }
  .speed-btn.active {
    background: var(--accent);
    color: #06121f;
  }
  .speed-btn.active::after { background: rgba(6, 18, 31, 0.55); }

  .hint {
    margin-left: auto;
    text-align: right;
    font-size: 11px;
    color: var(--dim);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="statusbar card">
      <div class="dot helper-down" id="statusDot"></div>
      <div class="status-text" id="statusText">Connecting to helper…</div>
      <div class="chips">
        <span class="chip mode" id="gameMode">-</span>
        <span class="chip" id="speedChip">1×</span>
        <span class="chip" id="paused">-</span>
        <span class="chip loop" id="loopChip"></span>
        <span class="chip focus" id="focusChip">click panel for keys</span>
      </div>
      <span class="scene-controls disabled" id="scene">
        <span class="camera-bar-label">Distance</span>
        <!-- Top-down spectator sits ~1900 units out; the upper end is deliberately
             well past that so you can pull back wider than the normal view. -->
        <input type="range" id="zoomInput" min="700" max="14000" step="100" value="2052" />
        <span class="camera-bar-value" id="zoomValue">2052</span>
        <button class="setup-toggle" id="zoomResetBtn" title="Back to the default player-view distance">Reset</button>
        <button class="setup-toggle" id="namesToggle" title="Replace summoner names with placeholders, for screenshots and recording">Hide names</button>
        <span class="control-sep"></span>
        <button class="cinematic-btn" id="cinematicBtn">Cinematic</button>
        <button class="setup-toggle" id="setupToggle">Setup</button>
      </span>
    </div>

    <!-- Opened from Setup in the status bar. Everything configured once and then
         left alone lives here, out of the way of a take. -->
    <div class="scene-setup card" id="setupPanel" hidden>
      <div class="setup-group">
        <span class="cue-controls-label">HUD</span>
        <div class="toggle-grid" id="toggleGrid"></div>
      </div>
    </div>

    <div class="roster disabled card" id="roster" title="Portrait locks the camera to that champion. Name shows their target frame in game.">
      <div class="roster-block">
        <div class="roster-block-label">Blue</div>
        <div class="roster-list" id="blueList"></div>
      </div>
      <div class="roster-block">
        <div class="roster-block-label">Red</div>
        <div class="roster-list" id="redList"></div>
      </div>
    </div>
    <div class="transport disabled card" id="transport">
      <div class="transport-controls">
        <span class="cmd-group" id="transportCmds"></span>
        <span class="control-sep"></span>
        <button class="pause-btn" id="pauseBtn">Pause</button>
        <span class="control-sep"></span>
        <div class="speed-presets" id="speedPresets">
          <button class="speed-btn" data-speed="0.25">0.25×</button>
          <button class="speed-btn primary" data-speed="0.5">0.5×</button>
          <button class="speed-btn" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="4">4×</button>
        </div>
        <span class="control-sep"></span>
        <span class="cmd-group" id="eventCmds"></span>
      </div>

      <div class="timeline-row">
        <div class="scrub-area" id="scrubArea">
          <div class="scrub-track" id="scrubTrack">
            <div class="scrub-fill" id="scrubFill"></div>
            <div class="scrub-ticks" id="scrubTicks"></div>
            <div class="loop-region" id="loopRegion"></div>
            <div class="loop-edge a" id="loopEdgeA"></div>
            <div class="loop-edge b" id="loopEdgeB"></div>
            <div class="scrub-markers" id="scrubMarkers"></div>
            <div class="cue-pins" id="cuePins"></div>
            <div class="scrub-ghost" id="scrubGhost">
              <div class="ghost-time" id="ghostTime">0:00</div>
            </div>
            <div class="scrub-handle" id="scrubHandle">
              <div class="handle-time" id="handleTime">0:00</div>
            </div>
          </div>
          <div class="hover-card" id="hoverCard"></div>
          <div class="time-readout">
            <span id="timeCurrent">0:00</span>
            <span class="time-next" id="timeNext"></span>
            <span id="timeTotal">0:00</span>
          </div>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot kill"></span>Kill</span>
            <span class="legend-item"><span class="legend-dot objective"></span>Objective</span>
            <span class="legend-item"><span class="legend-dot tower"></span>Structure</span>
            <span class="legend-item"><span class="legend-dot ace"></span>Ace</span>
            <span class="legend-item">Top cap = team</span>
            <span class="legend-item"><span class="legend-dot cue"></span>Cue (below bar)</span>
          </div>
        </div>

        <!-- In flow, not floating: opening a list used to drop it over the very
             scrub track you were about to click. -->
        <div class="rail">
          <div class="rail-tabs">
            <span class="rail-tab active" id="eventsToggle">Events (0)</span>
          </div>
          <div class="rail-body" id="eventsList"></div>
        </div>
      </div>

      <div class="cue-controls">
        <span class="cue-controls-label">Loop</span>
        <span class="cmd-group" id="loopCmds"></span>
        <span class="hint">shift+←/→ = ±1s · alt-drag = no snap · shift+click an event marker = cue</span>
      </div>
    </div>

    <!-- Its own card (top / champs / timeline / cues), not a rail tab - every
         cue shown expanded at once, growing the page downward as more are
         placed, rather than one at a time behind a click. -->
    <div class="cues-card card" id="cuesCard">
      <div class="cues-card-head">
        <span class="cues-card-title">Cues</span>
        <span class="cmd-group" id="cueCmds"></span>
        <span class="control-sep"></span>
        <button class="cues-action-btn" id="cuesExportBtn">Copy as text</button>
        <button class="cues-action-btn" id="cuesClearBtn">Clear all</button>
      </div>
      <div class="cues-list" id="cuesList"></div>
    </div>

  </div>

<script>
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const gameModeEl = document.getElementById('gameMode');
  const pausedEl = document.getElementById('paused');

  const speedChipEl = document.getElementById('speedChip');

  const transportEl = document.getElementById('transport');
  const scrubAreaEl = document.getElementById('scrubArea');
  const scrubTrack = document.getElementById('scrubTrack');
  const scrubFill = document.getElementById('scrubFill');
  const scrubTicksEl = document.getElementById('scrubTicks');
  const scrubGhostEl = document.getElementById('scrubGhost');
  const ghostTimeEl = document.getElementById('ghostTime');
  const scrubHandle = document.getElementById('scrubHandle');
  const handleTimeEl = document.getElementById('handleTime');
  const timeCurrentEl = document.getElementById('timeCurrent');
  const timeNextEl = document.getElementById('timeNext');
  const timeTotalEl = document.getElementById('timeTotal');
  const hoverCardEl = document.getElementById('hoverCard');
  const pauseBtn = document.getElementById('pauseBtn');
  const speedPresets = document.getElementById('speedPresets');

  const rosterEl = document.getElementById('roster');
  const zoomInputEl = document.getElementById('zoomInput');
  const zoomValueEl = document.getElementById('zoomValue');
  const zoomResetBtnEl = document.getElementById('zoomResetBtn');

  const sceneEl = document.getElementById('scene');
  const cinematicBtnEl = document.getElementById('cinematicBtn');
  const setupToggleEl = document.getElementById('setupToggle');
  const namesToggleEl = document.getElementById('namesToggle');
  const setupPanelEl = document.getElementById('setupPanel');
  const toggleGridEl = document.getElementById('toggleGrid');
  const blueListEl = document.getElementById('blueList');
  const redListEl = document.getElementById('redList');

  const scrubMarkersEl = document.getElementById('scrubMarkers');
  const eventsToggleEl = document.getElementById('eventsToggle');
  const eventsListEl = document.getElementById('eventsList');

  const cuePinsEl = document.getElementById('cuePins');
  const cuesListEl = document.getElementById('cuesList');
  const cuesExportBtnEl = document.getElementById('cuesExportBtn');
  const cuesClearBtnEl = document.getElementById('cuesClearBtn');
  const loopRegionEl = document.getElementById('loopRegion');
  const loopEdgeAEl = document.getElementById('loopEdgeA');
  const loopEdgeBEl = document.getElementById('loopEdgeB');
  const loopChipEl = document.getElementById('loopChip');
  const focusChipEl = document.getElementById('focusChip');

  // Display only - never steals focus back, never manages it, never warns on
  // an individual keypress. document.hasFocus() plus these two events is the
  // whole mechanism; no polling loop.
  function updateFocusChip() {
    focusChipEl.classList.toggle('visible', !document.hasFocus());
  }
  window.addEventListener('focus', updateFocusChip);
  window.addEventListener('blur', updateFocusChip);
  updateFocusChip();

  let currentState = 'helper-down';
  let gameModeKnown = false;

  // Single source of truth, refreshed ~10x/sec from the helper's WebSocket push.
  let lastPolled = { time: 0, length: 0, speed: 1, paused: false, seeking: false };

  // Scrub drag state - follows the mouse locally, writes once on release.
  let isDragging = false;
  let dragPreviewTime = null;

  // Seek coalescing - rapid arrow presses / drags collapse to the latest target only.
  let seekRunning = false;
  let pendingSeekTarget = null;
  let pendingSeekHold = false;
  let currentSeekTarget = null;

  // Serializes every write to /replay/playback so pause/seek/speed never interleave.
  let mutexQueue = Promise.resolve();
  function withMutex(fn) {
    const run = mutexQueue.then(fn, fn);
    mutexQueue = run.then(() => {}, () => {});
    return run;
  }

  let optimisticSpeed = null;

  function formatTime(seconds) {
    if (typeof seconds !== 'number' || !isFinite(seconds)) return '0:00';
    const s = Math.max(0, Math.floor(seconds));
    const mm = Math.floor(s / 60);
    const ss = s % 60;
    return `${mm}:${String(ss).padStart(2, '0')}`;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function setState(state, label) {
    currentState = state;
    statusDot.className = `dot ${state}`;
    statusText.textContent = label;
    transportEl.classList.toggle('disabled', state !== 'connected');
    rosterEl.classList.toggle('disabled', state !== 'connected');
    sceneEl.classList.toggle('disabled', state !== 'connected');
  }

  function getDisplayTime() {
    if (isDragging) return dragPreviewTime;
    if (seekRunning && currentSeekTarget !== null) return currentSeekTarget;
    return lastPolled.time;
  }

  function getDisplaySpeed() {
    return optimisticSpeed !== null ? optimisticSpeed : lastPolled.speed;
  }

  // Everything below runs ~10x/sec off the WS push, so each branch guards
  // against redundant DOM writes rather than re-rendering unconditionally.
  let lastRenderedLength = -1;
  let lastHandleLabel = '';
  let lastHandleClamp = '';
  let lastPausedLabel = '';
  let lastSpeedLabel = '';

  function renderTransport() {
    const length = lastPolled.length || 0;
    const time = getDisplayTime();
    const pct = length > 0 ? clamp((time / length) * 100, 0, 100) : 0;

    if (length !== lastRenderedLength) {
      lastRenderedLength = length;
      renderTicks();
      renderMarkers();
      renderCuePins();
      renderLoop();
    }

    scrubFill.style.width = `${pct}%`;
    scrubHandle.style.left = `${pct}%`;

    const timeLabel = formatTime(time);
    timeCurrentEl.textContent = timeLabel;
    if (timeLabel !== lastHandleLabel) {
      lastHandleLabel = timeLabel;
      handleTimeEl.textContent = timeLabel;
    }
    scrubHandle.classList.toggle('seeking', seekRunning);

    const handleClamp = pct < 5 ? 'start' : pct > 95 ? 'end' : '';
    if (handleClamp !== lastHandleClamp) {
      lastHandleClamp = handleClamp;
      handleTimeEl.classList.toggle('clamp-start', handleClamp === 'start');
      handleTimeEl.classList.toggle('clamp-end', handleClamp === 'end');
    }
    timeTotalEl.textContent = formatTime(length);

    updateEventProgress(time);

    pauseBtn.textContent = lastPolled.paused ? 'Play' : 'Pause';
    const pausedLabel = lastPolled.paused ? '❚❚ Paused' : '▶ Playing';
    if (pausedLabel !== lastPausedLabel) {
      lastPausedLabel = pausedLabel;
      pausedEl.textContent = pausedLabel;
      pausedEl.classList.toggle('is-paused', lastPolled.paused);
      pausedEl.classList.toggle('playing', !lastPolled.paused);
    }

    const speed = getDisplaySpeed();
    const speedLabel = `${speed}×`;
    if (speedLabel !== lastSpeedLabel) {
      lastSpeedLabel = speedLabel;
      speedChipEl.textContent = speedLabel;
      for (const btn of speedPresets.querySelectorAll('.speed-btn')) {
        btn.classList.toggle('active', Number(btn.dataset.speed) === Number(speed));
      }
    }
  }

  // --- Minute ticks ---

  function renderTicks() {
    const length = lastPolled.length || 0;
    scrubTicksEl.replaceChildren();
    if (length <= 0) return;

    const MINOR = 60;
    const MAJOR = 300;
    for (let t = MINOR; t < length; t += MINOR) {
      const pct = (t / length) * 100;
      const isMajor = t % MAJOR === 0;
      const tick = document.createElement('div');
      tick.className = isMajor ? 'tick major' : 'tick';
      tick.style.left = `${pct}%`;
      scrubTicksEl.appendChild(tick);
      if (isMajor) {
        const label = document.createElement('div');
        label.className = 'tick-label';
        label.style.left = `${pct}%`;
        label.textContent = formatTime(t);
        scrubTicksEl.appendChild(label);
      }
    }
  }

  function clearTransportDisplay() {
    lastPolled = { time: 0, length: 0, speed: 1, paused: false, seeking: false };
    renderTransport();
  }

  // --- Roster / camera lock ---

  let cameraState = { attached: false, selectionName: null };
  let lockInFlight = false;

  // Follow-cam framing. Confirmed on screen: yaw 0 pairs with an offset on -z.
  // The zoom slider scales y and z together along this direction - holding the
  // ratio is what lets distance change without ever re-aiming the camera.
  const FOLLOW_BASE = { y: 1700, z: -1150 };
  const FOLLOW_BASE_DISTANCE = Math.hypot(FOLLOW_BASE.y, FOLLOW_BASE.z); // ~2052
  const FOLLOW_ROTATION = { x: 0, y: 56, z: 0 };

  let followDistance = FOLLOW_BASE_DISTANCE;
  try {
    const saved = Number(localStorage.getItem('followDistance'));
    if (isFinite(saved) && saved > 0) followDistance = Math.round(saved);
  } catch (err) {
    // Storage unavailable - the default framing is fine.
  }

  function followOffset() {
    const scale = followDistance / FOLLOW_BASE_DISTANCE;
    return { x: 0, y: Math.round(FOLLOW_BASE.y * scale), z: Math.round(FOLLOW_BASE.z * scale) };
  }

  // Switching cameraMode resets fieldOfView, so every camera write carries the
  // client's current value forward explicitly - otherwise locking onto a
  // champion would silently snap the FOV back to a default. There is no FOV
  // control in the panel: distance is the one zoom that matters here, and two
  // separate "zoom" sliders that interact was worse than one that works.
  function currentFov() {
    return renderState && renderState.fieldOfView ? renderState.fieldOfView : 45;
  }

  async function lockCamera(riotIdGameName) {
    if (lockInFlight) return;
    lockInFlight = true;
    try {
      await fetch('/api/replay/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          // cameraMode must be sent every time, not set once. Anything that
          // changes the camera mode in-game - picking "Directed Camera" from
          // the client's own dropdown, or bumping the screen edge, which flips
          // it to manual - puts it back to "top", where the camera is on the
          // game's rails and selectionName/cameraAttached do nothing at all.
          // Without this line the roster buttons silently stop working.
          cameraMode: 'fps',
          selectionName: riotIdGameName,
          cameraAttached: true,
          selectionOffset: followOffset(),
          cameraRotation: FOLLOW_ROTATION,
          fieldOfView: currentFov(),
          // Brief 008: fps mode leaves the client's own mouse-look live, so
          // touching the game window drifts the shot mid-narration. Confirmed
          // live that cameraLookSpeed:0 kills that without needing a detect-
          // and-reassert loop - cameraRotation held through ten seconds of
          // mouse movement that previously moved it ~15-300 degrees.
          cameraLookSpeed: 0,
        }),
      });
      lastAction = { name: riotIdGameName, kind: 'camera' };
      try {
        localStorage.setItem('lastFollow', riotIdGameName);
      } catch (err) {
        // Adoption after a reload just won't work; the lock itself is fine.
      }
      renderRosterState();
    } catch (err) {
      // Next roster poll tick reconciles the lock indicator regardless.
    } finally {
      lockInFlight = false;
    }
  }

  // Selection only - brings up the target frame in game without touching the
  // camera. This is the single-click equivalent of the in-game hotkeys; the
  // camera lock is the double-click equivalent, and they are deliberately
  // separate controls here because they were conflated before.
  async function selectTarget(riotIdGameName) {
    if (lockInFlight) return;
    lockInFlight = true;
    try {
      await fetch('/api/replay/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ selectionName: riotIdGameName }),
      });
      lastAction = { name: riotIdGameName, kind: 'frame' };
      renderRosterState();
    } catch (err) {
      // Poll tick reconciles.
    } finally {
      lockInFlight = false;
    }
  }

  function buildRosterItem(player, number) {
    const item = document.createElement('div');
    item.className = 'roster-item';
    item.dataset.name = player.riotIdGameName;

    const portraitWrap = document.createElement('div');
    portraitWrap.className = 'roster-portrait-wrap';
    portraitWrap.title = 'Lock camera to this champion';
    portraitWrap.addEventListener('click', () => lockCamera(player.riotIdGameName));

    const camHint = document.createElement('div');
    camHint.className = 'roster-cam-hint';
    camHint.textContent = '◉';
    portraitWrap.appendChild(camHint);

    const img = document.createElement('img');
    img.className = 'roster-portrait';
    img.src = `/portraits/${encodeURIComponent(player.championName)}.png`;
    img.addEventListener('error', () => {
      const fallback = document.createElement('div');
      fallback.className = 'roster-portrait-fallback';
      fallback.textContent = (player.championName || '?').charAt(0);
      img.replaceWith(fallback);
    });
    portraitWrap.appendChild(img);
    item.appendChild(portraitWrap);

    const info = document.createElement('div');
    info.className = 'roster-info';
    info.title = 'Show target frame in game (no camera change)';
    info.addEventListener('click', () => selectTarget(player.riotIdGameName));

    const champEl = document.createElement('div');
    champEl.className = 'roster-champ';
    champEl.textContent = player.championName;
    info.appendChild(champEl);

    const nameEl = document.createElement('div');
    nameEl.className = 'roster-name';
    nameEl.textContent = rosterDisplayName(player, number);
    info.appendChild(nameEl);

    const statsEl = document.createElement('div');
    statsEl.className = 'roster-stats';
    const s = player.scores || {};
    statsEl.textContent = `${s.kills ?? 0}/${s.deaths ?? 0}/${s.assists ?? 0} · ${s.creepScore ?? 0} CS`;
    info.appendChild(statsEl);

    item.appendChild(info);
    return item;
  }

  function renderTeamBlock(container, players, offset) {
    container.replaceChildren();
    players.forEach((player, i) => container.appendChild(buildRosterItem(player, offset + i + 1)));
  }

  // Which card shows as active, and in which of the two states. Driven by what
  // was last clicked here rather than by polled state: `selectionName` clears
  // itself spontaneously, so a polled indicator drops out on its own while the
  // camera is still very much locked.
  let lastAction = { name: null, kind: null };

  // Re-frames the live follow when the zoom slider moves. Deliberately not
  // sharing `lockInFlight` with the roster clicks - that guard drops calls, and
  // a dropped call here would leave the camera at the wrong distance. Leading
  // -edge throttle instead, so dragging the slider stays responsive without
  // firing a request per pixel. `selectionName` has to go in every one of these:
  // posting selectionOffset on its own detaches the follow.
  let framingTimer = null;

  function scheduleFramingUpdate() {
    if (framingTimer) return;
    framingTimer = setTimeout(() => {
      framingTimer = null;
      applyFraming();
    }, 60);
  }

  async function applyFraming() {
    if (lastAction.kind !== 'camera' || !lastAction.name) return;
    try {
      await fetch('/api/replay/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cameraMode: 'fps',
          selectionName: lastAction.name,
          cameraAttached: true,
          selectionOffset: followOffset(),
          cameraRotation: FOLLOW_ROTATION,
          fieldOfView: currentFov(),
          cameraLookSpeed: 0,
        }),
      });
    } catch (err) {
      // Next slider move or lock reasserts it.
    }
  }

  function renderZoom() {
    zoomInputEl.value = String(Math.round(followDistance));
    // Read back rather than reusing the number: a range input snaps to its own
    // step, so the thumb and the readout would otherwise disagree.
    zoomValueEl.textContent = zoomInputEl.value;
  }

  // Aligned to the slider's own step so the thumb, the readout and the applied
  // offset are all the same number.
  function snapToSliderStep(value) {
    const step = Number(zoomInputEl.step) || 1;
    const min = Number(zoomInputEl.min) || 0;
    return Math.round((value - min) / step) * step + min;
  }

  function setFollowDistance(value) {
    followDistance = snapToSliderStep(value);
    try {
      localStorage.setItem('followDistance', String(followDistance));
    } catch (err) {
      // Not worth failing over.
    }
    renderZoom();
    scheduleFramingUpdate();
  }

  // FOLLOW_BASE_DISTANCE is the confirmed-good framing, and lands the camera at
  // about the height the game's own top-down camera sits at.
  zoomResetBtnEl.addEventListener('click', () => setFollowDistance(FOLLOW_BASE_DISTANCE));

  // Routed through the same setter the Reset button uses. Dragging and resetting
  // were separate copies of persist-then-reframe, which is the drift brief 007's
  // command table exists to prevent - one of them would eventually gain a step
  // the other didn't.
  zoomInputEl.addEventListener('input', () => setFollowDistance(Number(zoomInputEl.value)));

  function renderRosterState() {
    for (const item of document.querySelectorAll('.roster-item')) {
      const isTarget =
        lastAction.name && item.dataset.name.toLowerCase() === lastAction.name.toLowerCase();
      item.classList.toggle('cam-locked', !!isTarget && lastAction.kind === 'camera');
      item.classList.toggle('frame-selected', !!isTarget && lastAction.kind === 'frame');
    }
  }

  // Events carry summoner names only, so the timeline leans on the roster to
  // resolve a name to a champion portrait and a team colour. Best-effort:
  // turret/minion killers simply won't resolve, and the UI degrades to text.
  let playerByName = new Map();

  function playerFor(name) {
    if (!name) return null;
    return playerByName.get(String(name).toLowerCase()) || null;
  }

  function teamFor(name) {
    const player = playerFor(name);
    return player ? player.team : null;
  }

  // Display-only. The roster data is left alone on purpose: playerByName is what
  // resolves event summoner names to champion names, so anonymising it would
  // make the events rail fall back to printing the real names instead.
  let hideNames = false;
  try {
    hideNames = localStorage.getItem('hideNames') === '1';
  } catch (err) {
    // Storage unavailable; the toggle still works for this session.
  }

  let lastPlayers = [];

  function rosterDisplayName(player, number) {
    return hideNames ? `Player ${number}` : player.riotIdGameName;
  }

  function renderNamesToggle() {
    namesToggleEl.textContent = hideNames ? 'Show names' : 'Hide names';
    namesToggleEl.classList.toggle('open', hideNames);
  }

  namesToggleEl.addEventListener('click', () => {
    hideNames = !hideNames;
    try {
      localStorage.setItem('hideNames', hideNames ? '1' : '0');
    } catch (err) {
      // Preference just won't survive a reload.
    }
    renderNamesToggle();
    renderRoster(lastPlayers);
  });

  function renderRoster(players) {
    lastPlayers = players;
    playerByName = new Map(
      players
        .filter((p) => p.riotIdGameName)
        .map((p) => [p.riotIdGameName.toLowerCase(), { champion: p.championName, team: p.team }])
    );
    const blue = players.filter((p) => p.team === 'ORDER');
    const red = players.filter((p) => p.team === 'CHAOS');
    renderTeamBlock(blueListEl, blue, 0);
    renderTeamBlock(redListEl, red, blue.length);
    renderRosterState();

    // Markers and event labels can both be built before the first roster
    // arrives - no team caps, and summoner names where champion names belong.
    // Redraw once the names are actually resolvable.
    if (markersRenderedWithoutTeams && playerByName.size > 0) {
      renderMarkers();
      renderEventList();
    }
  }

  function clearRosterDisplay() {
    playerByName = new Map();
    lastAction = { name: null, kind: null };
    blueListEl.replaceChildren();
    redListEl.replaceChildren();
  }

  async function fetchGameMode() {
    try {
      const res = await fetch('/api/liveclientdata/gamestats');
      if (!res.ok) throw new Error(`status_${res.status}`);
      const data = await res.json();
      gameModeEl.textContent = data.gameMode || '-';
      gameModeKnown = true;
      syncCuesToIdentity(); // identity is only complete once gameMode lands
    } catch (err) {
      // replay may not be loaded yet - retry loop below will try again
    }
  }

  setInterval(() => {
    if (!gameModeKnown && currentState === 'connected') fetchGameMode();
  }, 3000);

  // --- HUD toggles (brief 006; camera presets removed as out of scope) ---

  // Partial POSTs verified live: sending {interfaceMinimap:false} alone changed
  // exactly 1 of 66 fields. No read-modify-write needed anywhere here.
  const HUD_TOGGLES = [
    { field: 'interfaceMinimap', label: 'Minimap' },
    { field: 'interfaceScoreboard', label: 'Scoreboard' },
    { field: 'interfaceScore', label: 'Score' },
    { field: 'interfaceFrames', label: 'Frames' },
    { field: 'interfaceChat', label: 'Chat' },
    { field: 'interfaceTimeline', label: 'Timeline' },
    { field: 'interfaceKillCallouts', label: 'Callouts' },
    { field: 'interfaceNeutralTimers', label: 'Timers' },
    { field: 'interfaceTarget', label: 'Target frame' },
    { field: 'healthBarChampions', label: 'HP champs' },
    { field: 'healthBarMinions', label: 'HP minions' },
    { field: 'healthBarStructures', label: 'HP towers' },
    { field: 'healthBarWards', label: 'HP wards' },
    { field: 'particles', label: 'Particles' },
    { field: 'floatingText', label: 'Floating text' },
    { field: 'fogOfWar', label: 'Fog of war' },
    { field: 'outlineSelect', label: 'Outlines' },
  ];

  // Composed from individual fields rather than `interfaceAll:false`, which the
  // brief warns also hides the in-game replay control bar. `interfaceReplay` is
  // deliberately absent from this list so that reference stays on screen.
  const CINEMATIC_HIDE = [
    'interfaceAnnounce', 'interfaceChat', 'interfaceFrames', 'interfaceKillCallouts',
    'interfaceMinimap', 'interfaceNeutralTimers', 'interfaceScore', 'interfaceScoreboard',
    'interfaceTarget', 'interfaceTimeline',
    'healthBarChampions', 'healthBarMinions', 'healthBarPets', 'healthBarStructures',
    'healthBarWards', 'floatingText',
  ];

  // Restoring the HUD forces these back on regardless of what was saved. Exact
  // restore alone can hand back a state you can't actually work in - if any of
  // these were already off when you hit Cinematic, turning it off would leave
  // you without a minimap or health bars and looking like it hadn't restored.
  const CINEMATIC_RESTORE_MIN = [
    'interfaceMinimap', 'interfaceFrames', 'interfaceTarget',
    'healthBarChampions', 'healthBarMinions', 'healthBarPets',
    'healthBarStructures', 'healthBarWards', 'fogOfWar',
  ];

  let renderState = null;
  let cinematicOn = false;

  async function postRender(body) {
    try {
      const res = await fetch('/api/replay/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      // The API answers 200 for unknown field names and silently ignores them,
      // so a status code proves nothing here. Callers verify by read-back via
      // the 1Hz render broadcast.
      return res.ok;
    } catch (err) {
      return false;
    }
  }

  function renderToggles() {
    toggleGridEl.replaceChildren();
    if (!renderState) return;
    for (const { field, label } of HUD_TOGGLES) {
      const value = renderState[field];
      if (value === undefined || value === null) continue; // e.g. interfaceQuests reports empty
      const chip = document.createElement('button');
      chip.className = `toggle-chip ${value ? 'on' : 'off'}`;
      chip.textContent = label;
      chip.addEventListener('click', () => postRender({ [field]: !value }));
      toggleGridEl.appendChild(chip);
    }
  }

  // Stores the *previous* values and restores those exactly - not defaults.
  // Persisted so a browser reload mid-cinematic can still put the HUD back.
  function readSavedHud() {
    try {
      const raw = localStorage.getItem('cinematicRestore');
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  async function toggleCinematic() {
    if (!renderState) return;
    if (!cinematicOn) {
      const saved = {};
      for (const field of CINEMATIC_HIDE) {
        if (renderState[field] !== undefined && renderState[field] !== null) {
          saved[field] = renderState[field];
        }
      }
      try {
        localStorage.setItem('cinematicRestore', JSON.stringify(saved));
      } catch (err) {
        // In-memory restore still works for this session.
      }
      const off = {};
      for (const field of Object.keys(saved)) off[field] = false;
      await postRender(off);
      cinematicOn = true;
    } else {
      const restore = { ...(readSavedHud() || {}) };
      for (const field of CINEMATIC_RESTORE_MIN) restore[field] = true;
      await postRender(restore);
      cinematicOn = false;
    }
    cinematicBtnEl.classList.toggle('active', cinematicOn);
    cinematicBtnEl.textContent = cinematicOn ? 'Restore HUD' : 'Cinematic';
  }

  cinematicBtnEl.addEventListener('click', toggleCinematic);

  setupToggleEl.addEventListener('click', () => {
    const open = setupPanelEl.hidden;
    setupPanelEl.hidden = !open;
    setupToggleEl.classList.toggle('open', open);
  });

  function applyRenderState(render) {
    renderState = render;

    // The client keeps following across a panel reload, but `lastAction` is
    // panel-local and starts empty - so the distance slider did nothing until
    // you re-clicked a portrait. Adopt a follow that's already running.
    //
    // The target name can't come from `selectionName`: it clears itself while
    // the follow carries on, so by the time this runs it's usually empty. The
    // last locked name is persisted at lock time and used as the fallback.
    if (!lastAction.name && render.cameraAttached && render.cameraMode === 'fps') {
      let name = render.selectionName;
      if (!name) {
        try {
          name = localStorage.getItem('lastFollow') || '';
        } catch (err) {
          name = '';
        }
      }
      if (name) {
        lastAction = { name, kind: 'camera' };
        renderRosterState();
      }
    }

    renderToggles();
  }

  // --- Event timeline ---

  // Events accumulate here for the whole page lifetime - seeking backward must never wipe them.
  // Keyed by content fingerprint, not EventID: the replay client re-emits the same real event
  // under a brand new EventID every time playback passes over that point again, so EventID
  // alone is not a safe dedup key here despite what it looks like it should be.
  let eventsByKey = new Map();
  let harvestToken = 0; // bumped whenever a new replay connects, invalidates any in-flight harvest
  let lastProcessId = null;

  // Explicit harvest (brief 009): a fresh replay's timeline only fills once the
  // user asks for it, so recording never opens on an uncommanded jump to the
  // end of the game. harvestDone covers both a cache hit and a completed scan.
  let harvestDone = false;
  let scanInFlight = false;

  const EVENT_CATEGORY = {
    ChampionKill: 'kill',
    Multikill: 'kill',
    FirstBlood: 'kill',
    Ace: 'ace',
    DragonKill: 'objective',
    BaronKill: 'objective',
    HeraldKill: 'objective',
    TurretKilled: 'tower',
    InhibKilled: 'tower',
    FirstBrick: 'tower',
  };
  const IGNORED_EVENT_NAMES = new Set(['GameStart', 'MinionsSpawning', 'GameEnd', 'InhibRespawned']);
  const loggedUnknownEvents = new Set();

  function categoryFor(event) {
    const cat = EVENT_CATEGORY[event.EventName];
    if (cat) return cat;
    if (!IGNORED_EVENT_NAMES.has(event.EventName) && !loggedUnknownEvents.has(event.EventName)) {
      loggedUnknownEvents.add(event.EventName);
      console.log(`[events] unrecognised EventName "${event.EventName}" - showing as unknown`, event);
    }
    return 'unknown';
  }

  function sideName(team) {
    return team === 'ORDER' ? 'blue' : 'red';
  }

  // Structure and minion killer IDs observed in the wild (issue #13):
  // "Turret_TChaos_L1_P0_1017949901_0", "Minion_T100L1S00N0874". Only the
  // prefix and (for structures) the team segment are read - same "only the
  // team segment is safe" judgement structureSide() applies below to its own
  // field. No live replay this session had a TurretKilled/InhibKilled event to
  // check these prefixes against (see brief 017's Outcome) - they come from
  // the issue's own pasted real game, not from memory.
  function engineActorLabel(name) {
    if (name.startsWith('Turret_') || name.startsWith('Inhib_')) return `a turret${structureSide(name)}`;
    if (name.startsWith('Minion_')) return 'a minion';
    return null;
  }

  // Events carry summoner names, which are unreadable at a glance mid-narration
  // - "Rengar killed Lux" lands far faster than "SomeSummoner41 killed xX_Player".
  // Falls back to the raw name when it doesn't resolve to a champion AND
  // doesn't match a known engine-ID shape either - that's an unresolved
  // summoner whose roster entry hasn't loaded yet, which is real information
  // and stays on screen. Gate on shape, not on resolution failure: a name
  // isn't guilty just because playerFor() hasn't caught up yet. An underscore
  // is the one thing every engine ID seen so far has and a summoner name
  // doesn't, so it's the gate for the shapes this session never saw a live
  // example of; unresolved shapes log once via the existing loggedUnknownEvents
  // set and render a fallback, never the raw string.
  function championName(name) {
    const player = playerFor(name);
    if (player) return player.champion;
    if (!name) return name || '';
    const engineLabel = engineActorLabel(name);
    if (engineLabel) return engineLabel;
    if (!name.includes('_')) return name;
    if (!loggedUnknownEvents.has(name)) {
      loggedUnknownEvents.add(name);
      console.log(`[events] unresolved engine-ID-shaped name "${name}" - showing as unknown`, name);
    }
    return 'something unknown';
  }

  // Structure IDs look like `Turret_TChaos_L2_P3_2521511112_0`. Only the team
  // segment is safe to read - the L/P numbers have no documented lane mapping,
  // so guessing "bot outer" from them would print confident nonsense. The raw
  // ID is useless in a readout, so drop it and lead with the killer instead.
  function structureSide(structureId) {
    if (typeof structureId !== 'string') return '';
    if (structureId.includes('TOrder')) return ' (blue)';
    if (structureId.includes('TChaos')) return ' (red)';
    return '';
  }

  function describeEvent(event) {
    switch (event.EventName) {
      case 'ChampionKill':
        return `${championName(event.KillerName)} killed ${championName(event.VictimName)}`;
      case 'Multikill':
        // Derived from a ChampionKill row already in the list - drop the
        // repeated subject and mark it as an annotation, not a peer event.
        return `★ ${event.KillStreak}x multikill`;
      case 'FirstBlood':
        return '★ First Blood';
      case 'Ace':
        return `★ Ace${event.AcingTeam ? ` (${sideName(event.AcingTeam)} team)` : ''}`;
      case 'DragonKill':
        return `Dragon (${event.DragonType || '?'}) - ${championName(event.KillerName)}`;
      case 'BaronKill':
        return `Baron - ${championName(event.KillerName)}`;
      case 'HeraldKill':
        return `Herald - ${championName(event.KillerName)}`;
      case 'TurretKilled':
        return `Turret${structureSide(event.TurretKilled)} - ${championName(event.KillerName) || '?'}`;
      case 'InhibKilled':
        return `Inhibitor${structureSide(event.InhibKilled)} - ${championName(event.KillerName) || '?'}`;
      case 'FirstBrick':
        // Derived from the TurretKilled row already in the list.
        return '★ First Tower';
      default:
        return event.EventName;
    }
  }

  // Identifies "the same real event" independent of EventID, which the client
  // reassigns every time replay playback re-passes the point it happened at.
  // 2s buckets absorb the jitter observed between re-emitted copies of the
  // same event, measured up to ~1s (brief 016/017) - a 200ms bucket only
  // absorbed a "few-millisecond jitter" that was never actually observed and
  // let a full second of drift produce duplicate rows for the same kill.
  // Two seconds is safe for a killer/victim pair - the respawn timer makes a
  // second genuinely distinct kill of the same victim by the same killer
  // impossible inside that window - but not for Multikill, which fires
  // repeatedly for the same killer with no victim to tell the copies apart,
  // so KillStreak is in the tuple specifically to keep a climbing streak's
  // rows from collapsing into one.
  function eventFingerprint(event) {
    return [
      event.EventName,
      Math.round(event.EventTime * 0.5),
      event.KillerName || '',
      event.VictimName || '',
      event.Recipient || '',
      event.Acer || '',
      event.TurretKilled || '',
      event.InhibKilled || '',
      event.KillStreak || '',
    ].join('|');
  }

  function visibleEvents() {
    return [...eventsByKey.values()]
      .filter((e) => !IGNORED_EVENT_NAMES.has(e.EventName))
      .sort((a, b) => a.EventTime - b.EventTime);
  }

  // Lane 0 = fights, lane 1 = neutral objectives, lane 2 = structures. Clustering
  // runs inside a lane, so a kill and a turret at the same second no longer
  // collapse into one ambiguous marker.
  const LANE_FOR = { kill: 0, ace: 0, objective: 1, tower: 2, unknown: 2 };
  const CLUSTER_PX = 7;

  // Sorted by time. Each entry: { lane, pxX, time, events, el }. Used for hover
  // cards, snapping, and active-event tracking, so it is the one structure the
  // whole timeline reads from.
  let markerClusters = [];
  let sortedEvents = [];
  let markersRenderedWithoutTeams = false;
  let lastMarkerTrackWidth = 0;

  function renderMarkers() {
    const length = lastPolled.length || 0;
    hideHoverCard();
    scrubMarkersEl.replaceChildren();
    markerClusters = [];
    activeClusterIdx = -2;
    if (length <= 0) return;

    const trackWidth = scrubTrack.getBoundingClientRect().width || 1;
    lastMarkerTrackWidth = trackWidth;
    markersRenderedWithoutTeams = playerByName.size === 0;

    const lanes = [[], [], []];
    for (const event of sortedEvents) {
      const lane = LANE_FOR[categoryFor(event)] ?? 2;
      lanes[lane].push(event);
    }

    // Empty lanes are collapsed rather than reserved. Plenty of replays contain
    // no dragon/baron/herald events at all, and an empty band of gutter above
    // the track reads as something broken.
    const laneSlot = [];
    let nextSlot = 0;
    for (let lane = 0; lane < lanes.length; lane++) {
      laneSlot[lane] = lanes[lane].length ? nextSlot++ : -1;
    }

    for (let lane = 0; lane < lanes.length; lane++) {
      let cursorPx = -Infinity;
      let current = null;
      for (const event of lanes[lane]) {
        const pxX = (event.EventTime / length) * trackWidth;
        if (current && pxX - cursorPx < CLUSTER_PX) {
          current.events.push(event);
        } else {
          current = { lane: laneSlot[lane], pxX, time: event.EventTime, events: [event] };
          markerClusters.push(current);
        }
        cursorPx = pxX;
      }
    }

    markerClusters.sort((a, b) => a.time - b.time);
    for (const cluster of markerClusters) {
      cluster.el = buildMarker(cluster, length);
      scrubMarkersEl.appendChild(cluster.el);
    }

    updateEventProgress(getDisplayTime(), true);
  }

  // Capped so a 20-kill teamfight can't claim a meaningful slice of game time -
  // above the cap the width stops growing but the count keeps counting.
  function clusterWidthPx(count) {
    return 8 + Math.min(count, 6) * 3;
  }

  function buildMarker(cluster, length) {
    const first = cluster.events[0];
    const isAce = cluster.events.some((e) => categoryFor(e) === 'ace');
    const cat = isAce ? 'ace' : categoryFor(first);
    const count = cluster.events.length;

    const marker = document.createElement('div');
    marker.className = `marker ${cat} lane${cluster.lane}${count > 1 ? ' cluster' : ''}`;
    marker.style.left = `${(first.EventTime / length) * 100}%`;
    if (count > 1) {
      marker.style.width = `${clusterWidthPx(count)}px`;
      const countEl = document.createElement('span');
      countEl.className = 'marker-count';
      countEl.textContent = String(count);
      marker.appendChild(countEl);
    }

    const team = teamFor(first.KillerName);
    if (team && cat !== 'ace') {
      const cap = document.createElement('div');
      cap.className = `cap ${team === 'ORDER' ? 'order' : 'chaos'}`;
      marker.appendChild(cap);
    }

    marker.addEventListener('mousedown', (e) => e.stopPropagation());
    marker.addEventListener('click', (e) => {
      e.stopPropagation();
      // Most cues land on events anyway - shift+click saves playing through to
      // the moment just to press M there.
      if (e.shiftKey) placeCue(first.EventTime);
      else requestSeek(first.EventTime);
    });
    marker.addEventListener('mouseenter', () => showHoverCard(cluster));
    marker.addEventListener('mouseleave', scheduleHideHoverCard);
    return marker;
  }

  // --- Active / next event ---

  let activeClusterIdx = -2;
  let lastNextLabel = '';
  let lastNextSoon = false;

  function updateEventProgress(time, force) {
    let idx = -1;
    for (let i = 0; i < markerClusters.length; i++) {
      if (markerClusters[i].time <= time) idx = i;
      else break;
    }
    if (idx !== activeClusterIdx || force) {
      activeClusterIdx = idx;
      for (let i = 0; i < markerClusters.length; i++) {
        const el = markerClusters[i].el;
        el.classList.toggle('past', i <= idx);
        el.classList.toggle('active', i === idx);
      }
    }

    const next = sortedEvents.find((e) => e.EventTime > time + 0.05);
    const label = next ? `▸ ${describeEvent(next)} in ${formatTime(next.EventTime - time)}` : '';
    if (label !== lastNextLabel) {
      lastNextLabel = label;
      timeNextEl.textContent = label;
    }
    const soon = !!next && next.EventTime - time <= 10;
    if (soon !== lastNextSoon) {
      lastNextSoon = soon;
      timeNextEl.classList.toggle('soon', soon);
    }
  }

  function stepEvent(direction) {
    const time = getDisplayTime();
    const target =
      direction > 0
        ? sortedEvents.find((e) => e.EventTime > time + 0.5)
        : [...sortedEvents].reverse().find((e) => e.EventTime < time - 0.5);
    if (target) requestSeek(target.EventTime);
  }

  // --- Hover card ---

  let hoverCluster = null;
  let hoverAnchorEl = null;
  let hoverHideTimer = null;

  function portraitImg(champion, extraClass) {
    const img = document.createElement('img');
    img.className = `hc-portrait${extraClass ? ` ${extraClass}` : ''}`;
    img.src = `/portraits/${encodeURIComponent(champion)}.png`;
    img.alt = champion;
    img.addEventListener('error', () => img.remove());
    return img;
  }

  function buildHoverRow(event) {
    const cat = categoryFor(event);
    const killer = playerFor(event.KillerName);
    const victim = playerFor(event.VictimName);

    const row = document.createElement('div');
    row.className = 'hc-row';
    if (killer) row.classList.add(killer.team === 'ORDER' ? 'order' : 'chaos');

    const dot = document.createElement('div');
    dot.className = `hc-dot ${cat}`;
    row.appendChild(dot);

    if (killer || victim) {
      const portraits = document.createElement('div');
      portraits.className = 'hc-portraits';
      if (killer) portraits.appendChild(portraitImg(killer.champion));
      if (killer && victim) {
        const arrow = document.createElement('span');
        arrow.className = 'hc-arrow';
        arrow.textContent = '›';
        portraits.appendChild(arrow);
      }
      if (victim) portraits.appendChild(portraitImg(victim.champion, 'victim'));
      row.appendChild(portraits);
    }

    const label = document.createElement('div');
    label.className = 'hc-label';
    label.textContent = describeEvent(event);
    row.appendChild(label);

    const time = document.createElement('div');
    time.className = 'hc-time';
    time.textContent = formatTime(event.EventTime);
    row.appendChild(time);

    row.addEventListener('click', (e) => {
      e.stopPropagation();
      hideHoverCard();
      if (e.shiftKey) placeCue(event.EventTime);
      else requestSeek(event.EventTime);
    });
    return row;
  }

  // Shared by event markers and cue pins - both anchor a card to a position on
  // the track, they just build different rows.
  function openHoverCard(pxX, rows, anchorEl) {
    clearTimeout(hoverHideTimer);
    if (hoverAnchorEl && hoverAnchorEl !== anchorEl) hoverAnchorEl.classList.remove('hot');
    hoverAnchorEl = anchorEl;
    if (anchorEl) anchorEl.classList.add('hot');

    hoverCardEl.replaceChildren(...rows);
    hoverCardEl.classList.add('visible');

    const areaWidth = scrubAreaEl.getBoundingClientRect().width;
    const cardWidth = hoverCardEl.getBoundingClientRect().width;
    const half = cardWidth / 2;
    hoverCardEl.style.left = `${clamp(pxX, half + 2, Math.max(half + 2, areaWidth - half - 2))}px`;
  }

  function showHoverCard(cluster) {
    hoverCluster = cluster;
    openHoverCard(cluster.pxX, cluster.events.map(buildHoverRow), cluster.el);
  }

  function scheduleHideHoverCard() {
    clearTimeout(hoverHideTimer);
    hoverHideTimer = setTimeout(() => hideHoverCard(), 140);
  }

  function hideHoverCard() {
    clearTimeout(hoverHideTimer);
    hoverCardEl.classList.remove('visible');
    hoverCardEl.replaceChildren();
    if (hoverAnchorEl) hoverAnchorEl.classList.remove('hot');
    hoverAnchorEl = null;
    hoverCluster = null;
  }

  hoverCardEl.addEventListener('mouseenter', () => clearTimeout(hoverHideTimer));
  hoverCardEl.addEventListener('mouseleave', scheduleHideHoverCard);

  // Wording says what to do, not what's wrong - an unscanned 4-event timeline
  // must not read like a quiet game that genuinely had 4.
  function harvestStateSuffix() {
    if (scanInFlight) return ' - scanning…';
    if (!harvestDone) return ' - not scanned';
    return '';
  }

  function renderEventList() {
    const events = sortedEvents;
    eventsToggleEl.textContent = `Events (${events.length})${harvestStateSuffix()}`;
    eventsListEl.replaceChildren();
    for (const event of events) {
      const row = document.createElement('div');
      row.className = 'event-row';

      const dot = document.createElement('div');
      dot.className = `event-dot ${categoryFor(event)}`;
      row.appendChild(dot);

      const label = document.createElement('div');
      label.className = 'event-label';
      label.textContent = describeEvent(event);
      row.appendChild(label);

      const time = document.createElement('div');
      time.className = 'event-time';
      time.textContent = formatTime(event.EventTime);
      row.appendChild(time);

      row.addEventListener('click', () => requestSeek(event.EventTime));
      eventsListEl.appendChild(row);
    }
  }
