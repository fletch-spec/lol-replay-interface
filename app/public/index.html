  // so KillStreak is in the tuple specifically to keep a climbing streak's
  // rows from collapsing into one.
  function eventFingerprint(event) {
    return [
      event.EventName,
      Math.round(event.EventTime * 0.5),
      event.KillerName || '',
      event.VictimName || '',
      event.Recipient || '',
      event.Acer || '',
      event.TurretKilled || '',
      event.InhibKilled || '',
      event.KillStreak || '',
    ].join('|');
  }

  function visibleEvents() {
    return [...eventsByKey.values()]
      .filter((e) => !IGNORED_EVENT_NAMES.has(e.EventName))
      .sort((a, b) => a.EventTime - b.EventTime);
  }

  // Lane 0 = fights, lane 1 = neutral objectives, lane 2 = structures. Clustering
  // runs inside a lane, so a kill and a turret at the same second no longer
  // collapse into one ambiguous marker.
  const LANE_FOR = { kill: 0, ace: 0, objective: 1, tower: 2, unknown: 2 };
  const CLUSTER_PX = 7;

  // Sorted by time. Each entry: { lane, pxX, time, events, el }. Used for hover
  // cards, snapping, and active-event tracking, so it is the one structure the
  // whole timeline reads from.
  let markerClusters = [];
  let sortedEvents = [];
  let markersRenderedWithoutTeams = false;
  let lastMarkerTrackWidth = 0;

  function renderMarkers() {
    const length = lastPolled.length || 0;
    hideHoverCard();
    scrubMarkersEl.replaceChildren();
    markerClusters = [];
    activeClusterIdx = -2;
    if (length <= 0) return;

    const trackWidth = scrubTrack.getBoundingClientRect().width || 1;
    lastMarkerTrackWidth = trackWidth;
    markersRenderedWithoutTeams = playerByName.size === 0;

    const lanes = [[], [], []];
    for (const event of sortedEvents) {
      const lane = LANE_FOR[categoryFor(event)] ?? 2;
      lanes[lane].push(event);
    }

    // Empty lanes are collapsed rather than reserved. Plenty of replays contain
    // no dragon/baron/herald events at all, and an empty band of gutter above
    // the track reads as something broken.
    const laneSlot = [];
    let nextSlot = 0;
    for (let lane = 0; lane < lanes.length; lane++) {
      laneSlot[lane] = lanes[lane].length ? nextSlot++ : -1;
    }

    for (let lane = 0; lane < lanes.length; lane++) {
      let cursorPx = -Infinity;
      let current = null;
      for (const event of lanes[lane]) {
        const pxX = (event.EventTime / length) * trackWidth;
        if (current && pxX - cursorPx < CLUSTER_PX) {
          current.events.push(event);
        } else {
          current = { lane: laneSlot[lane], pxX, time: event.EventTime, events: [event] };
          markerClusters.push(current);
        }
        cursorPx = pxX;
      }
    }

    markerClusters.sort((a, b) => a.time - b.time);
    for (const cluster of markerClusters) {
      cluster.el = buildMarker(cluster, length);
      scrubMarkersEl.appendChild(cluster.el);
    }

    updateEventProgress(getDisplayTime(), true);
  }

  // Capped so a 20-kill teamfight can't claim a meaningful slice of game time -
  // above the cap the width stops growing but the count keeps counting.
  function clusterWidthPx(count) {
    return 8 + Math.min(count, 6) * 3;
  }

  function buildMarker(cluster, length) {
    const first = cluster.events[0];
    const isAce = cluster.events.some((e) => categoryFor(e) === 'ace');
    const cat = isAce ? 'ace' : categoryFor(first);
    const count = cluster.events.length;
    // Ace keeps its own fixed white appearance (deliberate, brief 014) and
    // never takes a team class. Everything else is coloured by the killer's
    // team, or team-none when there isn't one - a structure killed by a
    // minion, or a neutral objective, resolve no team the same way.
    const team = isAce ? null : teamFor(first.KillerName);
    const teamClass = isAce ? '' : ` team-${team === 'ORDER' ? 'order' : team === 'CHAOS' ? 'chaos' : 'none'}`;

    const marker = document.createElement('div');
    marker.className = `marker ${cat} lane${cluster.lane}${teamClass}${count > 1 ? ' cluster' : ''}`;
    marker.style.left = `${(first.EventTime / length) * 100}%`;
    if (count > 1) {
      marker.style.width = `${clusterWidthPx(count)}px`;
      const countEl = document.createElement('span');
      countEl.className = 'marker-count';
      countEl.textContent = String(count);
      marker.appendChild(countEl);
    }

    marker.addEventListener('mousedown', (e) => e.stopPropagation());
    marker.addEventListener('click', (e) => {
      e.stopPropagation();
      // Most cues land on events anyway - shift+click saves playing through to
      // the moment just to press M there.
      if (e.shiftKey) placeCue(first.EventTime);
      else requestSeek(first.EventTime);
    });
    marker.addEventListener('mouseenter', () => showHoverCard(cluster));
    marker.addEventListener('mouseleave', scheduleHideHoverCard);
    return marker;
  }

  // --- Active / next event ---

  let activeClusterIdx = -2;
  let lastNextLabel = '';
  let lastNextSoon = false;

  function updateEventProgress(time, force) {
    let idx = -1;
    for (let i = 0; i < markerClusters.length; i++) {
      if (markerClusters[i].time <= time) idx = i;
      else break;
    }
    if (idx !== activeClusterIdx || force) {
      activeClusterIdx = idx;
      for (let i = 0; i < markerClusters.length; i++) {
        const el = markerClusters[i].el;
        el.classList.toggle('past', i <= idx);
        el.classList.toggle('active', i === idx);
      }
    }

    const next = sortedEvents.find((e) => e.EventTime > time + 0.05);
    const label = next ? `▸ ${describeEvent(next)} in ${formatTime(next.EventTime - time)}` : '';
    if (label !== lastNextLabel) {
      lastNextLabel = label;
      timeNextEl.textContent = label;
    }
    const soon = !!next && next.EventTime - time <= 10;
    if (soon !== lastNextSoon) {
      lastNextSoon = soon;
      timeNextEl.classList.toggle('soon', soon);
    }
  }

  function stepEvent(direction) {
    const time = getDisplayTime();
    const target =
      direction > 0
        ? sortedEvents.find((e) => e.EventTime > time + 0.5)
        : [...sortedEvents].reverse().find((e) => e.EventTime < time - 0.5);
    if (target) requestSeek(target.EventTime);
  }

  // --- Hover card ---

  let hoverCluster = null;
  let hoverAnchorEl = null;
  let hoverHideTimer = null;

  function portraitImg(champion, extraClass) {
    const img = document.createElement('img');
    img.className = `hc-portrait${extraClass ? ` ${extraClass}` : ''}`;
    img.src = `/portraits/${encodeURIComponent(champion)}.png`;
    img.alt = champion;
    img.addEventListener('error', () => img.remove());
    return img;
  }

  function buildHoverRow(event) {
    const cat = categoryFor(event);
    const killer = playerFor(event.KillerName);
    const victim = playerFor(event.VictimName);

    const row = document.createElement('div');
    row.className = 'hc-row';
    if (killer) row.classList.add(killer.team === 'ORDER' ? 'order' : 'chaos');

    const dot = document.createElement('div');
    dot.className = `hc-dot ${cat}`;
    row.appendChild(dot);

    if (killer || victim) {
      const portraits = document.createElement('div');
      portraits.className = 'hc-portraits';
      if (killer) portraits.appendChild(portraitImg(killer.champion));
      if (killer && victim) {
        const arrow = document.createElement('span');
        arrow.className = 'hc-arrow';
        arrow.textContent = '›';
        portraits.appendChild(arrow);
      }
      if (victim) portraits.appendChild(portraitImg(victim.champion, 'victim'));
      row.appendChild(portraits);
    }

    const label = document.createElement('div');
    label.className = 'hc-label';
    label.textContent = describeEvent(event);
    row.appendChild(label);

    const time = document.createElement('div');
    time.className = 'hc-time';
    time.textContent = formatTime(event.EventTime);
    row.appendChild(time);

    row.addEventListener('click', (e) => {
      e.stopPropagation();
      hideHoverCard();
      if (e.shiftKey) placeCue(event.EventTime);
      else requestSeek(event.EventTime);
    });
    return row;
  }

  // Shared by event markers and cue pins - both anchor a card to a position on
  // the track, they just build different rows.
  // position: fixed, so coordinates are viewport-relative and computed from
  // the anchor's own rect, not from a pixel offset inside .scrub-area (which
  // stopped being the containing block once the card left that clipping
  // context). Markers sit in the gutter above the track and grow further up;
  // cue pins sit in the strip below and grow further down - growing toward
  // the track in either case would cover it, breaking the rule briefs 007,
  // 013 and 014 all keep. Neither direction ever flips to the other; if the
  // card doesn't fit, it clamps at the viewport edge and scrolls internally
  // (max-height set below), same as the old behaviour's spirit.
  function openHoverCard(anchorEl, rows, growUp) {
    clearTimeout(hoverHideTimer);
    if (hoverAnchorEl && hoverAnchorEl !== anchorEl) hoverAnchorEl.classList.remove('hot');
    hoverAnchorEl = anchorEl;
    if (anchorEl) anchorEl.classList.add('hot');

    // Fill and reveal before measuring - a hidden or empty card measures
    // zero, and the previous card's width would leak through otherwise.
    hoverCardEl.replaceChildren(...rows);
    hoverCardEl.classList.add('visible');

    const anchorRect = anchorEl.getBoundingClientRect();
    const cardWidth = hoverCardEl.getBoundingClientRect().width;
    const half = cardWidth / 2;
    const centerX = anchorRect.left + anchorRect.width / 2;
    hoverCardEl.style.left = `${clamp(centerX, half + 2, Math.max(half + 2, window.innerWidth - half - 2))}px`;

    if (growUp) {
      hoverCardEl.style.top = 'auto';
      hoverCardEl.style.bottom = `${window.innerHeight - anchorRect.top + 2}px`;
      hoverCardEl.style.maxHeight = `${Math.max(60, Math.min(240, anchorRect.top - 6))}px`;
    } else {
      hoverCardEl.style.bottom = 'auto';
      hoverCardEl.style.top = `${anchorRect.bottom + 2}px`;
      hoverCardEl.style.maxHeight = `${Math.max(60, Math.min(240, window.innerHeight - anchorRect.bottom - 6))}px`;
    }
  }

  function showHoverCard(cluster) {
    hoverCluster = cluster;
    openHoverCard(cluster.el, cluster.events.map(buildHoverRow), true);
  }

  function scheduleHideHoverCard() {
    clearTimeout(hoverHideTimer);
    hoverHideTimer = setTimeout(() => hideHoverCard(), 140);
  }

  function hideHoverCard() {
    clearTimeout(hoverHideTimer);
    hoverCardEl.classList.remove('visible');
    hoverCardEl.replaceChildren();
    if (hoverAnchorEl) hoverAnchorEl.classList.remove('hot');
    hoverAnchorEl = null;
    hoverCluster = null;
  }

  hoverCardEl.addEventListener('mouseenter', () => clearTimeout(hoverHideTimer));
  hoverCardEl.addEventListener('mouseleave', scheduleHideHoverCard);

  // Fixed coordinates are viewport-relative and stale the moment the anchor
  // moves - hiding is simpler than repositioning and the card is transient
  // by nature, so there's nothing lost by making the user re-hover.
  window.addEventListener('scroll', hideHoverCard, true);
  window.addEventListener('resize', hideHoverCard);

  // Wording says what to do, not what's wrong - an unscanned 4-event timeline
  // must not read like a quiet game that genuinely had 4.
  function harvestStateSuffix() {
    if (scanInFlight) return ' - scanning…';
    if (!harvestDone) return ' - not scanned';
    return '';
  }

  function renderEventList() {
    const events = sortedEvents;
    eventsToggleEl.textContent = `Events (${events.length})${harvestStateSuffix()}`;
    eventsListEl.replaceChildren();
    for (const event of events) {
      const row = document.createElement('div');
      row.className = 'event-row';

      const dot = document.createElement('div');
      dot.className = `event-dot ${categoryFor(event)}`;
      row.appendChild(dot);

      const label = document.createElement('div');
      label.className = 'event-label';
      label.textContent = describeEvent(event);
      row.appendChild(label);

      const time = document.createElement('div');
      time.className = 'event-time';
      time.textContent = formatTime(event.EventTime);
      row.appendChild(time);

      row.addEventListener('click', () => requestSeek(event.EventTime));
      eventsListEl.appendChild(row);
    }
  }

  function clearEventsDisplay() {
    eventsByKey.clear();
    loggedUnknownEvents.clear();
    sortedEvents = [];
    renderMarkers();
    renderEventList();
  }

  function mergeEvents(events) {
    let changed = false;
    for (const event of events) {
      const key = eventFingerprint(event);
      if (!eventsByKey.has(key)) changed = true;
      eventsByKey.set(key, event);
    }
    if (changed) {
      sortedEvents = visibleEvents();
      renderMarkers();
      renderEventList();
      refreshCommands();
    }
  }

  // The Replay API has no stable game identifier: /replay/game returns only a
  // processID (new every client launch) and no path in the whole spec carries a
  // match ID or the replay filename - checked against the swagger, not assumed.
  // So identity is the composite brief 005 names as its fallback. Imperfect, but
  // it distinguishes replays in practice, and events and cues must agree on it.
  function replayIdentity() {
    return `${gameMode}:${Math.round(lastPolled.length)}`;
  }

  function identityKnown() {
    return gameMode !== '-' && (lastPolled.length || 0) > 0;
  }

  // Brief 026: v2 is the full play-through harvest. Bumping this means a
  // replay already scanned by the old seek-to-end method (which measurably
  // missed events - see brief 026's Outcome) re-scans instead of loading its
  // old, incomplete array from localStorage.
  const EVENTS_CACHE_VERSION = 'v2';

  function eventsCacheKey() {
    return `lol-events:${EVENTS_CACHE_VERSION}:${replayIdentity()}`;
  }

  function cuesStorageKey() {
    return `cues:${replayIdentity()}`;
  }

  // Cache-only load, run automatically on connect. Never seeks - a replay that
  // hasn't been scanned this session just shows whatever mergeEvents() has
  // picked up progressively from the 1Hz feed, until the user asks for a scan.
  function loadCachedEvents() {
    const length = lastPolled.length;
    if (!length) return;
    try {
      const cached = localStorage.getItem(eventsCacheKey());
      if (cached) {
        mergeEvents(JSON.parse(cached));
        harvestDone = true;
      }
    } catch (err) {
      // Corrupt cache entry - leave harvestDone false, same as never scanned.
    }
    renderEventList();
    refreshCommands();
  }

  // Brief 026: measured live against a full manual play-through on the same
  // replay before touching this function - seek-to-end found 92 events, the
  // play-through found 101 (missing 5 ChampionKill, 2 TurretKilled, 1
  // Multikill, 1 Ace - see the Outcome for the full breakdown). The premise
  // this function used to rest on - "the client's cumulative event feed
  // populates fully" from a seek to the end - does not hold: the feed only
  // carries what playback has actually passed over. So this seeks nowhere
  // except back to 0, then lets one forward pass at the highest verified
  // speed carry it through the whole game exactly once. A single forward
  // pass is deliberate, not just simplest - brief 017 found that re-passing
  // a time range re-emits the same event with a new EventID and up to ~1s of
  // jitter, and its 2s dedupe bucket still misses some of those; anything
  // that re-passes a range (chunked seeking) would multiply that, where one
  // pass minimises it.
  const SCAN_SPEED = 32; // measured live: 4/8/16/32 all reported and advanced correctly; see Outcome
  const SCAN_STALL_TICKS = 8; // ~8s with no time advance = the client stopped responding

  let scanCancelRequested = false;

  function cancelScan() {
    scanCancelRequested = true;
  }

  async function scanReplay() {
    if (scanInFlight || harvestDone || !identityKnown()) return;
    const token = ++harvestToken;
    scanInFlight = true;
    scanCancelRequested = false;
    // A scan is not cue navigation - it sweeps the whole timeline and back,
    // so whatever was the "active" cue before it no longer means anything
    // about where the playhead is. Same rule requestSeek() already applies
    // to every other non-cue seek.
    if (activeCue !== null) {
      activeCue = null;
      renderCueList();
      renderCuePins();
    }
    renderEventList();
    refreshCommands();

    const length = lastPolled.length;
    const originalTime = lastPolled.time;
    const originalSpeed = lastPolled.speed;
    const originalPaused = lastPolled.paused;
    // checkLoop() seeks back to A whenever playback crosses B while a loop is
    // armed - left alone, a scan that starts with one armed becomes an
    // infinite loop between A and B instead of a pass through the game.
    const wasLoopEnabled = loopEnabled;
    loopEnabled = false;

    const scanBtn = commandButtons.get('scanReplay');
    const scanLabelEl = scanBtn && scanBtn.firstChild;
    let aborted = false;

    try {
      // One held sequence rather than requestSeek() + setSpeed() + a separate
      // pause write: each of those goes through withMutex() on its own, and
      // the client can silently drop a "paused: false" that arrives while
      // it's still settling from the seek (see waitForSeekSettled()'s own
      // comment) - composing them here keeps the wait between the seek and
      // the unpause in the same breath instead of trusting call-site timing.
      optimisticSpeed = SCAN_SPEED;
      renderTransport();
      await withMutex(async () => {
        try {
          await postPlayback({ paused: true });
          await postPlayback({ time: 0 });
          await waitForSeekSettled();
          await postPlayback({ speed: SCAN_SPEED });
          await postPlayback({ paused: false });
        } catch (err) {
          // The stall guard below catches a client that never starts moving.
        }
      });

      let lastTime = -1;
      let stallTicks = 0;
      while (true) {
        await new Promise((resolve) => setTimeout(resolve, 1000));
        if (token !== harvestToken) return; // a different replay connected mid-scan
        if (scanCancelRequested) {
          aborted = true;
          break;
        }

        const time = lastPolled.time;
        if (scanLabelEl) {
          const pct = length > 0 ? Math.min(100, Math.round((time / length) * 100)) : 0;
          scanLabelEl.textContent = `Scanning… ${pct}%`;
        }
        if (time >= length - 1) break;

        // At 32x, one real second is ~32 game-seconds - a stalled client
        // reads as no movement at all, not slow movement, so a small
        // epsilon catches it without false-tripping on jitter.
        if (Math.abs(time - lastTime) < 0.05) {
          stallTicks++;
          if (stallTicks >= SCAN_STALL_TICKS) {
            aborted = true;
            console.log(`[events] scan aborted - playback stalled at ${time.toFixed(1)}s`);
            break;
          }
        } else {
          stallTicks = 0;
        }
        lastTime = time;
      }

      if (token === harvestToken && !aborted) {
        // A brief grace period for the last poll tick(s) near the very end
        // of the pass to land and merge before the cache write - unlike the
        // old seek-to-end harvest, this isn't jumping straight to GameEnd, so
        // there's no comparable backfill gap, just ordinary poll lag.
        await new Promise((resolve) => setTimeout(resolve, 2000));
        if (token !== harvestToken) return;
        try {
          localStorage.setItem(eventsCacheKey(), JSON.stringify([...eventsByKey.values()]));
        } catch (err) {
          // Storage full or unavailable - harvest still worked for this session.
        }
        harvestDone = true;
      }
    } finally {
      // Restore playhead, speed and paused state on every exit path -
      // completed, cancelled, or cut off by a replay swap - extending the
      // old harvest's "restore the playhead even on interrupt, unconditional
      // on the token match" to the two writes a two-second harvest never had
      // to care about.
      await withMutex(async () => {
        try {
          await postPlayback({ paused: true });
          await postPlayback({ time: originalTime });
          await waitForSeekSettled();
          await postPlayback({ speed: originalSpeed });
          if (!originalPaused) await postPlayback({ paused: false });
        } catch (err) {
          // Poll tick reconciles regardless.
        }
      });
      optimisticSpeed = null;
      renderTransport();
      if (scanLabelEl) scanLabelEl.textContent = COMMANDS.scanReplay.label;
      if (token === harvestToken) {
        loopEnabled = wasLoopEnabled;
        renderLoop();
        scanInFlight = false;
        renderEventList();
        refreshCommands();
      }
    }
  }

  function handleNewGame() {
    gameModeKnown = false;
    harvestToken++; // invalidate any harvest still running against the previous replay
    harvestDone = false;
    scanInFlight = false;
    clearEventsDisplay();
    (async () => {
      await fetchGameMode();
      syncCuesToIdentity();
      loadCachedEvents();
    })();
  }

  // The WebSocket can stay "connected" while the underlying replay swaps to a different game
  // entirely (another app on this machine drives the same client) - processID is the signal
  // that catches that case, since the WS state transition alone won't.
  function checkGameChange(processID) {
    if (processID == null) return;
    if (lastProcessId === null) {
      lastProcessId = processID;
      return;
    }
    if (processID === lastProcessId) return;
    lastProcessId = processID;
    console.log('[events] replay processID changed mid-session - clearing accumulated events for the new game');
    handleNewGame();
  }

  // --- Cue points + A/B loop (brief 005) ---

  const DEFAULT_LEAD = 2;

  let cues = [];
  // Tracked by object identity, not index (brief 013). placeCue() sorts the
  // array and deleteCue() splices it, so an index captured at selection time
  // is stale by the next render - a reference into `cues` never is.
  let activeCue = null;
  let cueIdentity = null;

  let loopA = null;
  let loopB = null;
  let loopEnabled = false;

  // Built once and re-appended on each list render, so its contents and
  // selection survive the list repainting underneath it.
  const exportAreaEl = document.createElement('textarea');
  exportAreaEl.className = 'cue-export';
  exportAreaEl.readOnly = true;
  exportAreaEl.spellcheck = false;
  // Brief 025: this is now only the clipboard-failure fallback (and Export
  // notes' popup-blocked fallback below), so it needs a dismiss path it never
  // had before. Same idiom as the cue label/notes fields: blur, then
  // stopPropagation so the document handler's INPUT/TEXTAREA guard - which
  // reads document.activeElement - doesn't get read after blur() has already
  // changed it and let the same Escape fall through to loopClear.
  exportAreaEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      exportAreaEl.classList.remove('visible');
      exportAreaEl.blur();
      e.stopPropagation();
    }
  });

  // A and B are kept exactly as pressed; the usable range is derived, so setting
  // them in either order works.
  function loopRange() {
    if (loopA === null || loopB === null) return null;
    const start = Math.min(loopA, loopB);
    const end = Math.max(loopA, loopB);
    return end - start < 0.5 ? null : { start, end };
  }

  function loadCues() {
    try {
      const raw = localStorage.getItem(cuesStorageKey());
      const parsed = raw ? JSON.parse(raw) : [];
      cues = (Array.isArray(parsed) ? parsed : [])
        .filter((c) => c && typeof c.t === 'number' && isFinite(c.t))
        .map((c) => ({
          t: c.t,
          note: typeof c.note === 'string' ? c.note : '',
          lead: typeof c.lead === 'number' ? c.lead : DEFAULT_LEAD,
          // No migration - `note` keeps its exact meaning, `body` is simply
          // absent on anything saved before this brief.
          body: typeof c.body === 'string' ? c.body : '',
        }))
        .sort((a, b) => a.t - b.t);
    } catch (err) {
      cues = []; // Corrupt entry - start clean rather than blocking the panel.
    }
    // A fresh identity's cues are new objects - the nav cursor must not keep
    // pointing at whatever the previous replay had active.
    activeCue = null;
    renderCues();
  }

  function saveCues() {
    if (!identityKnown()) return;
    try {
      localStorage.setItem(cuesStorageKey(), JSON.stringify(cues));
    } catch (err) {
      // Storage full or unavailable - cues still work for this session.
    }
  }

  // Identity only becomes known once both gameMode and length have arrived, and
  // it changes when a different replay loads. Every path that could change it
  // ends up here.
  function syncCuesToIdentity() {
    if (!identityKnown()) return;
    const identity = replayIdentity();
    if (identity === cueIdentity) return;
    cueIdentity = identity;
    clearLoop();
    loadCues();
  }

  function clearCuesDisplay() {
    cues = [];
    activeCue = null;
    cueIdentity = null;
    clearLoop();
    renderCues();
  }

  function placeCue(atTime) {
    if (!identityKnown()) return;
    const t = clamp(typeof atTime === 'number' ? atTime : getDisplayTime(), 0, lastPolled.length || 0);
    // Double-tap guard - M is meant to be hit fast and without looking.
    if (cues.some((c) => Math.abs(c.t - t) < 0.5)) return;
    cues.push({ t, note: '', lead: DEFAULT_LEAD, body: '' });
    cues.sort((a, b) => a.t - b.t);
    saveCues();
    renderCues();
  }

  function deleteCue(index) {
    const cue = cues[index];
    cues.splice(index, 1);
    if (activeCue === cue) activeCue = null;
    saveCues();
    renderCues();
  }

  // Lands at `cue.t - lead` and holds paused: you want the couple of seconds
  // before the fight to set it up verbally, not to arrive mid-explosion.
  function seekToCue(index) {
    const cue = cues[index];
    if (!cue) return;
    activeCue = cue;
    const lead = typeof cue.lead === 'number' ? cue.lead : DEFAULT_LEAD;
    requestSeek(Math.max(0, cue.t - lead), { holdPaused: true, keepCueCursor: true });
    renderCues();
  }

  // Steps a cursor rather than searching by time. After landing at
  // `cue.t - lead` the playhead sits *before* the cue it just moved to, so a
  // time-based "next cue after now" would find the same cue again and never
  // advance. The cursor is cleared by any seek the user makes another way,
  // which is what re-syncs it to wherever they scrubbed to.
  function gotoCue(direction) {
    if (!cues.length) return;
    let index;
    const currentIndex = activeCue ? cues.indexOf(activeCue) : -1;
    if (currentIndex !== -1) {
      index = currentIndex + direction;
    } else if (direction > 0) {
      index = cues.findIndex((c) => c.t > getDisplayTime() + 0.5);
    } else {
      const now = getDisplayTime();
      index = -1;
      for (let i = cues.length - 1; i >= 0; i--) {
        if (cues[i].t < now - 0.5) {
          index = i;
          break;
        }
      }
    }
    if (index < 0 || index >= cues.length) return;
    seekToCue(index);
  }

  function setLoopPoint(which) {
    if (which === 'a') loopA = getDisplayTime();
    else loopB = getDisplayTime();
    renderLoop();
  }

  function toggleLoop() {
    if (!loopRange()) return;
    loopEnabled = !loopEnabled;
    renderLoop();
  }

  function clearLoop() {
    loopA = null;
    loopB = null;
    loopEnabled = false;
    renderLoop();
  }

  // Driven by the same ~10Hz playback push the transport uses - no second
  // timer, and no second seek path. Deliberately inert while paused: pausing
  // mid-loop must neither cancel the loop nor wrap it.
  function checkLoop() {
    if (!loopEnabled || lastPolled.paused || seekRunning) return;
    const range = loopRange();
    if (!range) return;
    if (lastPolled.time >= range.end) {
      requestSeek(range.start, { keepCueCursor: true });
    }
  }

  function renderLoop() {
    const length = lastPolled.length || 0;
    const pct = (t) => (length > 0 ? clamp((t / length) * 100, 0, 100) : 0);
    const range = loopRange();

    loopEdgeAEl.classList.toggle('visible', loopA !== null && length > 0);
    if (loopA !== null) loopEdgeAEl.style.left = `${pct(loopA)}%`;
    loopEdgeBEl.classList.toggle('visible', loopB !== null && length > 0);
    if (loopB !== null) loopEdgeBEl.style.left = `${pct(loopB)}%`;

    if (range && length > 0) {
      loopRegionEl.style.left = `${pct(range.start)}%`;
      loopRegionEl.style.width = `${pct(range.end) - pct(range.start)}%`;
      loopRegionEl.classList.add('visible');
      loopRegionEl.classList.toggle('armed', loopEnabled);
    } else {
      loopRegionEl.classList.remove('visible', 'armed');
    }

    const label = range
      ? `Loop ${formatTime(range.start)}–${formatTime(range.end)}${loopEnabled ? ' ⟲' : ' (off)'}`
      : '';
    loopChipEl.textContent = label;
    loopChipEl.classList.toggle('visible', !!label);
    loopChipEl.classList.toggle('armed', loopEnabled);
    refreshCommands();
  }

  function renderCuePins() {
    const length = lastPolled.length || 0;
    cuePinsEl.replaceChildren();
    if (length <= 0) return;

    cues.forEach((cue, index) => {
      const pin = document.createElement('div');
      pin.className = 'cue-pin';
      if (cue.note) pin.classList.add('noted');
      if (cue === activeCue) pin.classList.add('active');
      pin.style.left = `${clamp((cue.t / length) * 100, 0, 100)}%`;

      pin.addEventListener('mousedown', (e) => e.stopPropagation());
      pin.addEventListener('mousemove', (e) => e.stopPropagation());
      pin.addEventListener('click', (e) => {
        e.stopPropagation();
        seekToCue(index);
      });
      pin.addEventListener('mouseenter', () => {
        hideGhost(); // the pin sits under the track; the ghost line here is just noise
        openHoverCard(pin, [buildCueCardRow(cue, index)], false);
      });
      pin.addEventListener('mouseleave', scheduleHideHoverCard);
      cuePinsEl.appendChild(pin);
    });
  }

  function buildCueCardRow(cue, index) {
    const row = document.createElement('div');
    row.className = 'hc-row';

    const dot = document.createElement('div');
    dot.className = 'hc-dot';
    dot.style.background = 'var(--cue)';
    row.appendChild(dot);

    const label = document.createElement('div');
    label.className = 'hc-label';
    label.textContent = cue.note || `Cue ${index + 1}`;
    row.appendChild(label);

    const time = document.createElement('div');
    time.className = 'hc-time';
    time.textContent = formatTime(cue.t);
    row.appendChild(time);

    row.addEventListener('click', (e) => {
      e.stopPropagation();
      hideHoverCard();
      seekToCue(index);
    });
    return row;
  }

  // Every cue shown expanded at once, in its own card - not a rail tab, not
  // one at a time behind a click (per live feedback on brief 013's original
  // shape). Label left, notes right, per cue block.
  function renderCueList() {
    // Brief 025: placing or deleting a cue while Clear all is armed must not
    // leave it reading "Clear all?" with its timer orphaned by the render
    // this function's callers are about to do anyway.
    disarmClear();
    cuesListEl.replaceChildren();

    if (!cues.length) {
      const empty = document.createElement('div');
      empty.className = 'cues-empty';
      empty.textContent = 'No cues yet - press M while watching to drop one.';
      cuesListEl.appendChild(empty);
    }

    cues.forEach((cue, index) => {
      const block = document.createElement('div');
      block.className = `cue-block${cue === activeCue ? ' active' : ''}`;

      const head = document.createElement('div');
      head.className = 'cue-block-head';

      const num = document.createElement('span');
      num.className = 'cue-num';
      num.textContent = String(index + 1);
      head.appendChild(num);

      const time = document.createElement('span');
      time.className = 'cue-time';
      time.textContent = formatTime(cue.t);
      time.title = 'Jump to this cue';
      time.addEventListener('click', () => seekToCue(index));
      head.appendChild(time);

      const leadLabel = document.createElement('label');
      leadLabel.className = 'cue-lead-label';
      leadLabel.append('Lead-in');
      const lead = document.createElement('input');
      lead.type = 'number';
      lead.className = 'cue-lead';
      lead.min = '0';
      lead.max = '15';
      lead.step = '1';
      lead.value = String(typeof cue.lead === 'number' ? cue.lead : DEFAULT_LEAD);
      lead.addEventListener('input', () => {
        const raw = lead.value;
        const n = Number(raw);
        cue.lead = raw === '' || !isFinite(n) ? DEFAULT_LEAD : clamp(Math.round(n), 0, 15);
        saveCues();
      });
      leadLabel.appendChild(lead);
      leadLabel.append('s');
      head.appendChild(leadLabel);

      const del = document.createElement('button');
      del.className = 'cue-del';
      del.textContent = 'Delete';
      del.title = 'Delete cue';
      del.addEventListener('click', () => deleteCue(index));
      head.appendChild(del);

      block.appendChild(head);

      const body = document.createElement('div');
      body.className = 'cue-block-body';

      // Label: the short line shown in the pin hover card and the export.
      const label = document.createElement('input');
      label.className = 'cue-label';
      label.value = cue.note || '';
      label.placeholder = 'Label (list, pin, export)…';
      label.addEventListener('input', () => {
        cue.note = label.value;
        saveCues();
        renderCuePins();
      });
      label.addEventListener('keydown', (e) => {
        // stopPropagation matters here: blur() runs synchronously, so by the
        // time this event would otherwise reach the document-level handler,
        // document.activeElement has already changed and the INPUT-tag guard
        // there no longer sees this field as focused - the same Escape would
        // fall through and fire loopClear otherwise.
        if (e.key === 'Enter' || e.key === 'Escape') {
          label.blur();
          e.stopPropagation();
        }
      });
      body.appendChild(label);

      // Notes: the paragraph. Never exported, never shown on the pin. No
      // render call on input, on purpose - nothing else displays it, and
      // rebuilding this list mid-keystroke would destroy its own caret.
      const notes = document.createElement('textarea');
      notes.className = 'cue-notes';
      notes.value = cue.body || '';
      notes.placeholder = 'Notes - what to say about this moment. Never exported, never shown on the pin.';
      notes.addEventListener('input', () => {
        cue.body = notes.value;
        saveCues();
      });
      notes.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          notes.blur();
          e.stopPropagation();
        }
      });
      body.appendChild(notes);

      block.appendChild(body);
      cuesListEl.appendChild(block);
    });

    cuesExportBtnEl.disabled = cues.length === 0;
    cuesExportMdBtnEl.disabled = cues.length === 0;
    cuesClearBtnEl.disabled = cues.length === 0;
  }

  function renderCues() {
    renderCuePins();
    renderCueList();
    refreshCommands();
  }

  document.getElementById('cuesCard').appendChild(exportAreaEl);

  cuesExportBtnEl.addEventListener('click', () => exportCues(cuesExportBtnEl));
  cuesExportMdBtnEl.addEventListener('click', exportCuesMarkdown);

  // Brief 025: two-click arm rather than window.confirm() - a confirm() moves
  // focus off the document, and this panel's hotkeys only work while it has
  // it (brief 011's focus chip, brief 020's Outcome on window.open() costing
  // the same thing). First click arms and starts a 3s window; second click
  // while armed clears for real. Escape, a click elsewhere, or the timeout
  // all disarm without touching a cue.
  let clearArmed = false;
  let clearArmTimer = null;

  function disarmClear() {
    if (!clearArmed) return;
    clearArmed = false;
    clearTimeout(clearArmTimer);
    clearArmTimer = null;
    cuesClearBtnEl.textContent = 'Clear all';
    cuesClearBtnEl.classList.remove('armed');
  }

  cuesClearBtnEl.addEventListener('click', (e) => {
    e.stopPropagation(); // the document click-elsewhere listener below would otherwise disarm this same click
    if (!clearArmed) {
      clearArmed = true;
      cuesClearBtnEl.textContent = 'Clear all?';
      cuesClearBtnEl.classList.add('armed');
      clearArmTimer = setTimeout(disarmClear, 3000);
      return;
    }
    disarmClear();
    cues = [];
    activeCue = null;
    saveCues();
    renderCues();
  });

  document.addEventListener('click', () => disarmClear());

  // `MM:SS - note`, one line per cue. This exact shape is the point: it pastes
  // straight into a YouTube description as chapter markers.
  function cuesAsText() {
    // A cue with no note emits just the timestamp - the brief's `MM:SS - note`
    // shape with an empty note would leave a dangling separator on every line
    // you'd then have to clean out of a YouTube description by hand.
    return cues.map((c) => (c.note ? `${formatTime(c.t)} - ${c.note}` : formatTime(c.t))).join('\n');
  }

  // Brief 025: clipboard-first. A real click is exactly the case where
  // navigator.clipboard.writeText's transient-user-activation requirement is
  // satisfied, so the textarea - Ctrl+C's guaranteed fallback - only needs to
  // appear when the API actually refuses. It stays in the file for that case
  // and for Export notes' popup-blocked fallback below; it's no longer the
  // primary path.
  let exportRestoreTimer = null;

  async function exportCues(button) {
    const text = cuesAsText();

    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (err) {
      copied = false;
    }

    if (copied) {
      exportAreaEl.classList.remove('visible');
      button.textContent = 'Copied ✓';
    } else {
      exportAreaEl.value = text;
      exportAreaEl.classList.add('visible');
      exportAreaEl.focus();
      exportAreaEl.select();
      button.textContent = 'Selected - Ctrl+C';
    }

    // Two fast clicks used to stack two of these - the first restore could
    // fire while the second click's label was still showing.
    if (exportRestoreTimer) clearTimeout(exportRestoreTimer);
    exportRestoreTimer = setTimeout(() => {
      exportRestoreTimer = null;
      button.textContent = 'Copy as text';
    }, 2000);
  }

  // Full markdown - label *and* body, everything cuesAsText() deliberately
  // leaves out to protect the YouTube chapter contract. No DOM, no window -
  // just the string, so it's testable on its own and reusable by the
  // popup-blocked fallback below.
  function cuesAsMarkdown() {
    // replayIdentity() reads "-:0" before a replay connects (identityKnown()
    // is false then) - the cues are still real, but the header must not say
    // that, so this doesn't call replayIdentity() at all.
    const header = identityKnown()
      ? `# Cue notes - ${gameMode}, ${formatTime(lastPolled.length || 0)}`
      : '# Cue notes';
    const date = new Date().toISOString().slice(0, 10);
    const lines = [header, `_${cues.length} cue${cues.length === 1 ? '' : 's'}, exported ${date}_`, ''];
    // cues is kept sorted by placeCue(), but the export shouldn't inherit
    // that assumption silently.
    for (const cue of [...cues].sort((a, b) => a.t - b.t)) {
      // An empty cue is a timestamp someone marked, and that's a complete
      // thought - no placeholder text for a missing label or body.
      lines.push(cue.note ? `## ${formatTime(cue.t)} - ${cue.note}` : `## ${formatTime(cue.t)}`);
      if (cue.body) lines.push(cue.body);
      lines.push('');
    }
    return lines.join('\n').trimEnd() + '\n';
  }

  // A second export, not a replacement for the in-page textarea above:
  // window.open() moves keyboard focus off the panel, and the panel's
  // hotkeys only work while it has focus - brief 011 shipped a chip
  // specifically because dead keypresses from exactly this were confusing.
  // Pressing this mid-take costs hotkeys until the user clicks back, so the
  // no-focus-cost textarea path stays for that reason - don't consolidate
  // them later. Called synchronously (no await first) because window.open()
  // needs transient user activation and loses it otherwise.
  function exportCuesMarkdown() {
    const markdown = cuesAsMarkdown();
    const win = window.open();
    if (!win) {
      // Popup blocked - fall back to the existing in-page textarea rather
      // than failing silently.
      exportAreaEl.value = markdown;
      exportAreaEl.classList.add('visible');
      exportAreaEl.focus();
      exportAreaEl.select();
      return;
    }
    win.document.open();
    win.document.write(
      '<!doctype html><html><head><title>Cue notes</title><style>' +
        'body{margin:0;background:#12161c}' +
        'textarea{box-sizing:border-box;width:100%;height:100vh;border:0;padding:20px;' +
        'background:#12161c;color:#e6e9ef;font:14px/1.5 Consolas,"Cascadia Mono",monospace;resize:none}' +
        '</style></head><body><textarea readonly></textarea></body></html>'
    );
    win.document.close();
    // textarea.value, never innerHTML or interpolating into the written HTML
    // above - cue text is user input and will contain <, &, quotes.
    const area = win.document.querySelector('textarea');
    area.value = markdown;
    area.focus();
    area.select();
  }

  // --- Playback writes ---

  async function postPlayback(body) {
    const res = await fetch('/api/replay/playback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`status_${res.status}`);
    return res.json();
  }

  // The client silently drops a "paused: false" write that arrives while it's still settling
  // from a seek - confirmed directly: the unpause response itself came back still paused. Wait
  // for the polled `seeking` flag to clear before sending it.
  async function waitForSeekSettled(maxWaitMs = 1500) {
    // Fetches fresh state directly rather than reading lastPolled - the passive WS broadcast
    // lags just enough that lastPolled.seeking can still show the stale pre-seek value here.
    const start = Date.now();
    while (Date.now() - start < maxWaitMs) {
      try {
        const state = await fetch('/api/replay/playback').then((r) => r.json());
        if (!state.seeking) return;
      } catch (err) {
        // Keep trying until the timeout.
      }
      await new Promise((resolve) => setTimeout(resolve, 80));
    }
  }

  // `holdPaused` leaves playback paused after landing instead of restoring the
  // previous play state. Cue navigation needs that, and it has to happen inside
  // this function: a separate pause write afterwards would be a second path
  // through the mutex and could interleave with the seek's own resume.
  async function doSeek(target, holdPaused) {
    return withMutex(async () => {
      const wasPlaying = !lastPolled.paused;
      try {
        await postPlayback({ paused: true });
        await postPlayback({ time: target });
        if (wasPlaying && !holdPaused) {
          await waitForSeekSettled();
          await postPlayback({ paused: false });
        }
      } catch (err) {
        // Next poll tick reconciles the UI regardless.
      }
    });
  }

  async function requestSeek(target, options = {}) {
    // Any seek that isn't cue navigation breaks the cue cursor - the user has
    // moved somewhere of their own accord, so N should re-derive from position.
    if (!options.keepCueCursor && activeCue !== null) {
      activeCue = null;
      renderCueList();
      renderCuePins();
    }

    const length = lastPolled.length || 0;
    pendingSeekTarget = clamp(target, 0, length);
    pendingSeekHold = !!options.holdPaused;
    if (seekRunning) return;
    seekRunning = true;
    try {
      while (pendingSeekTarget !== null) {
        currentSeekTarget = pendingSeekTarget;
        const holdPaused = pendingSeekHold;
        pendingSeekTarget = null;
        renderTransport();
        await doSeek(currentSeekTarget, holdPaused);
      }
    } finally {
      seekRunning = false;
      currentSeekTarget = null;
      renderTransport();
    }
  }

  async function togglePause() {
    return withMutex(async () => {
      try {
        await postPlayback({ paused: !lastPolled.paused });
      } catch (err) {
        // Poll tick reconciles.
      }
    });
  }

  async function setSpeed(value) {
    optimisticSpeed = value;
    renderTransport();
    return withMutex(async () => {
      try {
        await postPlayback({ speed: value });
      } catch (err) {
        optimisticSpeed = null;
        renderTransport();
      }
    });
  }

  // --- Scrub interaction ---

  // Matches the marker's 16px hit target: if the cursor is over a marker you get
  // that event, otherwise you get the raw position. A wider radius sounds more
  // helpful but a kill-heavy game packs markers ~15px apart, and snapping then
  // covers most of the bar and fights precise scrubbing.
  const SNAP_PX = 8;

  // One nearest-cluster implementation, shared by click-snap (targetFromEvent,
  // any lane) and the gutter hover magnet (brief 014, one lane). `lane`
  // omitted searches every lane; passed, it restricts to a rendered slot.
  function nearestCluster(px, maxDistance, lane) {
    let best = null;
    let bestDistance = Infinity;
    for (const candidate of markerClusters) {
      if (lane !== undefined && candidate.lane !== lane) continue;
      const distance = Math.abs(candidate.pxX - px);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = candidate;
      }
    }
    return bestDistance <= maxDistance ? best : null;
  }

  // Magnetic snap: within SNAP_PX of a marker, a click lands on the event
  // rather than wherever the cursor happened to be. Alt suppresses it for
  // precise scrubbing.
  function targetFromEvent(e) {
    const rect = scrubTrack.getBoundingClientRect();
    const length = lastPolled.length || 0;
    const px = clamp(e.clientX - rect.left, 0, rect.width);
    let time = rect.width > 0 ? (px / rect.width) * length : 0;

    const cluster = !e.altKey && length > 0 ? nearestCluster(px, SNAP_PX) : null;
    if (cluster) time = cluster.time;

    return { time, cluster, px: cluster ? cluster.pxX : px, trackWidth: rect.width };
  }

  // Cursor Y within the 34px gutter -> rendered lane slot. Fixed to the
  // .marker.laneN CSS positions (top 2/14/25, height 9) - the midpoints
  // between rows. A lane with no active slot simply has no cluster to match,
  // so a collapsed lane's dead band needs no special-casing here.
  function laneForGutterY(y) {
    if (y < 12.5) return 0;
    if (y < 24) return 1;
    return 2;
  }

  // Gutter-wide hover target (brief 014): sweeping anywhere in the marker
  // gutter opens the nearest cluster in the row under the cursor, rather than
  // requiring a pixel-precise hit on a several-px-wide marker.
  scrubMarkersEl.addEventListener('mousemove', (e) => {
    const trackRect = scrubTrack.getBoundingClientRect();
    const gutterRect = scrubMarkersEl.getBoundingClientRect();
    const px = e.clientX - trackRect.left;
    const lane = laneForGutterY(e.clientY - gutterRect.top);
    const cluster = nearestCluster(px, SNAP_PX, lane);
    if (!cluster) {
      scheduleHideHoverCard();
      return;
    }
    // Only rebuild the card on an actual cluster change - replaceChildren()
    // on every mousemove pixel would thrash it for no reason while the mouse
    // sits inside one cluster's snap radius.
    if (cluster !== hoverCluster) showHoverCard(cluster);
  });
  scrubMarkersEl.addEventListener('mouseleave', scheduleHideHoverCard);

  let ghostCluster = null;

  function showGhost(target) {
    scrubGhostEl.style.left = `${target.px}px`;
    scrubGhostEl.classList.add('visible');
    scrubGhostEl.classList.toggle('snapped', !!target.cluster);
    scrubGhostEl.classList.toggle('flip', target.px > target.trackWidth - 70);
    ghostTimeEl.textContent = formatTime(target.time);

    if (ghostCluster !== target.cluster) {
      if (ghostCluster && ghostCluster !== hoverCluster) ghostCluster.el.classList.remove('hot');
      ghostCluster = target.cluster;
      if (ghostCluster) ghostCluster.el.classList.add('hot');
    }
  }

  function hideGhost() {
    scrubGhostEl.classList.remove('visible', 'snapped', 'flip');
    if (ghostCluster && ghostCluster !== hoverCluster) ghostCluster.el.classList.remove('hot');
    ghostCluster = null;
  }

  function onDragMove(e) {
    const target = targetFromEvent(e);
    dragPreviewTime = target.time;
    showGhost(target);
    renderTransport();
  }

  function onDragEnd(e) {
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    const target = dragPreviewTime;
    isDragging = false;
    dragPreviewTime = null;
    hideGhost();
    if (target !== null) requestSeek(target);
  }

  scrubTrack.addEventListener('mousedown', (e) => {
    if (currentState !== 'connected') return;
    const target = targetFromEvent(e);
    isDragging = true;
    dragPreviewTime = target.time;
    showGhost(target);
    renderTransport();
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  });

  scrubTrack.addEventListener('mousemove', (e) => {
    if (currentState !== 'connected' || isDragging) return;
    showGhost(targetFromEvent(e));
  });

  scrubTrack.addEventListener('mouseleave', () => {
    if (!isDragging) hideGhost();
  });

  // --- Buttons ---

  // Routed through the command table like everything else - it predates the
  // table and calling togglePause() directly would be the one action with two
  // codepaths.
  pauseBtn.addEventListener('click', () => runCommand('playPause'));

  speedPresets.addEventListener('click', (e) => {
    const btn = e.target.closest('.speed-btn');
    if (!btn || currentState !== 'connected') return;
    setSpeed(Number(btn.dataset.speed));
  });

  // --- Keyboard ---

  // --- Commands (brief 007) ---

  // The single definition of every action the panel can perform. Buttons and
  // hotkeys both dispatch through here, so there is no second codepath that can
  // drift - and `enabled`/`active` give one place to answer "can this run right
  // now" and "does this button look on".
  function seekBy(delta) {
    requestSeek(getDisplayTime() + delta);
  }

  const COMMANDS = {
    playPause: { hotkey: 'Space', run: () => togglePause() },
    seekBack: { label: '« 5s', hotkey: '←', run: () => seekBy(-5) },
    seekFwd: { label: '5s »', hotkey: '→', run: () => seekBy(5) },
    prevEvent: {
      label: '‹ Event',
      hotkey: ',',
      run: () => stepEvent(-1),
      enabled: () => sortedEvents.length > 0,
    },
    nextEvent: {
      label: 'Event ›',
      hotkey: '.',
      run: () => stepEvent(1),
      enabled: () => sortedEvents.length > 0,
    },
    // No hotkey on purpose - this plays the game from 0 to the end and back,
    // and that is not something you want reachable by an accidental keypress
    // mid-take. Brief 026: stays enabled while scanning (dropped the
    // !scanInFlight condition) because the button is now the progress
    // surface and the cancel control - disabling it would remove both.
    scanReplay: {
      label: 'Scan replay',
      run: () => (scanInFlight ? cancelScan() : scanReplay()),
      enabled: () => identityKnown() && !harvestDone,
    },
    placeCue: {
      label: '+ Cue',
      hotkey: 'M',
      run: () => placeCue(),
      enabled: () => identityKnown(),
    },
    prevCue: {
      label: '‹ Cue',
      hotkey: 'B',
      run: () => gotoCue(-1),
      enabled: () => cues.length > 0,
    },
    nextCue: {
      label: 'Cue ›',
      hotkey: 'N',
      run: () => gotoCue(1),
      enabled: () => cues.length > 0,
    },
    loopA: {
      label: 'Set A',
      hotkey: '[',
      run: () => setLoopPoint('a'),
      active: () => loopA !== null,
    },
    loopB: {
      label: 'Set B',
      hotkey: ']',
      run: () => setLoopPoint('b'),
      active: () => loopB !== null,
    },
    loopToggle: {
      label: 'Loop',
      hotkey: 'L',
      run: () => toggleLoop(),
      enabled: () => !!loopRange(),
      active: () => loopEnabled,
    },
    loopClear: {
      label: 'Clear',
      hotkey: 'Esc',
      run: () => clearLoop(),
      enabled: () => loopA !== null || loopB !== null,
    },
  };

  function commandEnabled(id) {
    const command = COMMANDS[id];
    return !command.enabled || command.enabled();
  }

  function runCommand(id) {
    if (currentState !== 'connected' || !commandEnabled(id)) return;
    COMMANDS[id].run();
    refreshCommands();
  }

  const commandButtons = new Map();

  function commandButton(id) {
    const command = COMMANDS[id];
    const btn = document.createElement('button');
    btn.className = 'cmd-btn';
    btn.dataset.command = id;

    const label = document.createElement('span');
    label.textContent = command.label;
    btn.appendChild(label);

    // The hotkey rides on the button, so the accelerator teaches itself and the
    // two input methods are visibly the same action. Commands with no hotkey
    // (scanReplay - deliberately not reachable by keypress) skip this span
    // rather than render the literal word "undefined".
    if (command.hotkey) {
      const key = document.createElement('span');
      key.className = 'cmd-key';
      key.textContent = command.hotkey;
      btn.appendChild(key);
    }

    btn.addEventListener('click', () => runCommand(id));
    commandButtons.set(id, btn);
    return btn;
  }

  function refreshCommands() {
    for (const [id, btn] of commandButtons) {
      const command = COMMANDS[id];
      btn.disabled = !commandEnabled(id);
      btn.classList.toggle('on', !!command.active && command.active());
    }
  }

  const HOTKEY_TO_COMMAND = {
    ' ': 'playPause',
    Spacebar: 'playPause',
    ',': 'prevEvent',
    '<': 'prevEvent',
    '.': 'nextEvent',
    '>': 'nextEvent',
    m: 'placeCue',
    n: 'nextCue',
    b: 'prevCue',
    '[': 'loopA',
    ']': 'loopB',
    l: 'loopToggle',
    Escape: 'loopClear',
  };

  document.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    const tag = active && active.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (active && active.isContentEditable)) return;
    // Brief 025: Escape while Clear all is armed cancels the arm rather than
    // also firing loopClear - the two destructive-ish actions stacking on one
    // keypress would be a surprise, and cancelling the arm is what the arm
    // itself implies "escape" should mean.
    if (e.key === 'Escape' && clearArmed) {
      disarmClear();
      return;
    }
    if (currentState !== 'connected') return;

    // Arrows carry a shift variant for ±1s, which has no button. Same seekBy()
    // the buttons use, so there is still only one implementation.
    if (e.key === 'ArrowLeft' || e.key === 'Left') {
      e.preventDefault();
      if (e.shiftKey) seekBy(-1);
      else runCommand('seekBack');
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'Right') {
      e.preventDefault();
      if (e.shiftKey) seekBy(1);
      else runCommand('seekFwd');
      return;
    }

    const id = HOTKEY_TO_COMMAND[e.key] || HOTKEY_TO_COMMAND[e.key.toLowerCase()];
    if (!id) return;
    e.preventDefault();
    runCommand(id);
  });

  // --- WebSocket connection ---

  let ws;
  let reconnectTimer;

  function connect() {
    ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      setState('no-replay', 'Helper up, waiting for replay…');
    };

    ws.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (msg.type === 'roster') {
        checkGameChange(msg.processID);
        cameraState = msg.camera || { attached: false, selectionName: null };
        if (msg.render) applyRenderState(msg.render);
        renderRoster(msg.players || []);
        return;
      }

      if (msg.type === 'events') {
        checkGameChange(msg.processID);
        mergeEvents(msg.events || []);
        return;
      }

      if (msg.type !== 'playback') return;

      if (msg.state === 'connected') {
        const wasConnected = currentState === 'connected';
        setState('connected', 'Connected');
        lastPolled = msg.playback;
        if (optimisticSpeed !== null && Math.abs(lastPolled.speed - optimisticSpeed) < 0.001) {
          optimisticSpeed = null;
        }
        renderTransport();
        checkLoop();
        if (!wasConnected) handleNewGame();
      } else {
        setState('no-replay', 'No replay loaded');
        clearTransportDisplay();
        clearRosterDisplay();
        clearEventsDisplay();
        clearCuesDisplay();
        gameModeKnown = false;
        gameMode = '-';
        lastProcessId = null;
        harvestDone = false;
        scanInFlight = false;
      }
    };

    ws.onclose = () => {
      setState('helper-down', 'Helper unreachable - retrying…');
      clearTransportDisplay();
      clearRosterDisplay();
      clearEventsDisplay();
      clearCuesDisplay();
      gameModeKnown = false;
      gameMode = '-';
      lastProcessId = null;
      harvestDone = false;
      scanInFlight = false;
      reconnectTimer = setTimeout(connect, 1000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  // Clustering is computed in pixels, so the markers are only correct for the
  // width they were measured at. A window resize listener misses the cases that
  // actually bite - the panel laid out at ~0px in a background tab, or the
  // events dropdown changing the track's share of the row - so watch the track
  // itself. Markers don't affect the track's box, so this can't feed back.
  function remeasureMarkers() {
    if (lastPolled.length <= 0) return;
    const width = scrubTrack.getBoundingClientRect().width;
    if (width <= 0 || Math.abs(width - lastMarkerTrackWidth) < 1) return;
    renderMarkers();
    renderCuePins();
  }

  new ResizeObserver(remeasureMarkers).observe(scrubTrack);

  // The observer alone isn't enough: its callbacks are delivered on the
  // rendering loop, which browsers suspend for a hidden tab. Open the panel on
  // a background monitor tab and it lays out at ~0px wide, every event collapses
  // into one cluster, and nothing ever re-measures. Confirmed live. This poll
  // costs one layout read per second and closes that hole.
  setInterval(remeasureMarkers, 1000);

  // Each group goes in the card that owns what it acts on, rather than one
  // undifferentiated toolbar.
  // Seek controls flank Pause (brief 024) - brief 015 grouped them together
  // beside Pause for the same reason this brief now splits the group: keep
  // both scrub-by-5s actions adjacent to the control they scrub around, not
  // exiled to the event steppers on the far side of speed.
  document.getElementById('seekBackGroup').append(commandButton('seekBack'));
  document.getElementById('seekFwdGroup').append(commandButton('seekFwd'));
  document.getElementById('eventCmds').append(
    commandButton('prevEvent'),
    commandButton('nextEvent'),
    commandButton('scanReplay')
  );
  document.getElementById('cueCmds').append(
    commandButton('placeCue'),
    commandButton('prevCue'),
    commandButton('nextCue')
  );
  document.getElementById('loopCmds').append(
    commandButton('loopA'),
    commandButton('loopB'),
    commandButton('loopToggle'),
    commandButton('loopClear')
  );
  refreshCommands();

  connect();
  renderTransport();
  renderZoom();
  renderNamesToggle();
</script>
</body>
</html>
